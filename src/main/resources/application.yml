spring:
  application:
    name: freshmarket

  profiles:
    # 아무도 프로필을 지정하지 않으면 local 로 본다. 배포와 테스트는 프로필을 직접 주므로 이 값이 덮인다
    default: local

  # 아래 셋은 환경마다 갈린다. 값을 주지 않으면 compose.yaml 의 기본 구성에 맞는다.
  # 운영은 application-prod.yml 이 기본값 없이 다시 선언하므로 이 기본값이 살아나지 않는다.
  # bootRun 은 spring-boot-docker-compose 가 띄운 컨테이너에서 읽어낸 값이 이 셋을 덮는다
  datasource:
    # rewriteBatchedStatements 는 JDBC 배치를 여러 행짜리 문장 하나로 합친다.
    # 지금 배치를 쓰는 곳은 선착순 발급뿐이지만, 전용 프로파일에만 넣으면 테스트와 운영이
    # 서로 다른 실패 모양을 보게 되어 그 분기를 검증할 수 없다
    # 드라이버 옵션을 여기 붙이지 않는다. 아래 data-source-properties 가 갖는다.
    # 여기 적으면 DB_URL 이 주입되는 환경에서 콜론 뒤가 통째로 버려져 로컬에서만 적용된다.
    url: "${DB_URL:jdbc:mysql://localhost:3306/freshmarket}"
    username: "${DB_USERNAME:freshmarket}"
    password: "${DB_PASSWORD:freshmarket}"
    driver-class-name: com.mysql.cj.jdbc.Driver

    # 값의 근거는 infra 의 앱과DB 장애대응구조 4.4~4.6절에 있다.
    # 안쪽이 더 짧아야 톰캣 스레드가 DB 를 기다리다 고갈되지 않는다
    hikari:
      # 이름이 비슷한 값이 여럿이라 각각 무엇을 재는지 먼저 적는다. 프로파일이 이 값을 덮을 때도
      # 뜻은 같다.
      #
      #   connection-timeout   Hikari.  풀에 커넥션을 달라고 하고 받기까지 기다리는 상한
      #   validation-timeout   Hikari.  빌려주기 전에 그 커넥션이 살아 있는지 확인하는 상한
      #   keepalive-time       Hikari.  노는 커넥션을 이 주기로 찔러 살아 있는지 본다
      #   max-lifetime         Hikari.  이만큼 산 커넥션은 닫고 새것으로 바꾼다
      #   connectTimeout       JDBC.    커넥션을 새로 세우는 상한. TCP 핸드셰이크와 MySQL 인증
      #   socketTimeout        JDBC.    세워진 커넥션에서 서버가 보낸 바이트를 기다리는 상한
      #
      # 앞의 넷은 Hikari 가 자기 풀에 걸고 뒤의 둘은 드라이버가 소켓에 건다. 층이 다르다.
      #
      # 드라이버 쪽 둘은 기본값이 0, 곧 무제한이다. 안 걸면 조용히 끊긴 연결을 영영 기다린다.
      # 그래서 이 둘은 값을 고르는 것이 아니라 반드시 걸어야 하는 것이다.
      #
      # socketTimeout 은 쿼리 실행 시간 제한이 아니다. 읽기 한 번마다 재는 값이라 결과가 패킷
      # 여러 번에 나눠 오면 그 사이마다 시계가 다시 시작한다. 그리고 여기서 포기해도 서버 쪽
      # 쿼리는 계속 돈다. 클라이언트가 기다리기를 그만두는 것뿐이다.
      #
      # Hikari 는 connection-timeout 과 validation-timeout 에 하한 250ms 를 강제한다. 그보다
      # 작게 적으면 경고 로그와 함께 250 으로 덮어써서 적힌 값과 도는 값이 갈린다.

      # 풀이 마르면 요청은 여기서 3초 만에 실패한다. 스레드를 붙잡고 있지 않는다
      connection-timeout: 3000
      validation-timeout: 1000
      keepalive-time: 120000
      # MySQL wait_timeout 보다 짧아야 죽은 커넥션을 잡는다
      max-lifetime: 1500000
      # 앱은 오토스케일링으로 최대 3대까지 늘고 배포 중에는 신규가 겹쳐 4대가 된다.
      # 그 4대가 동시에 쥐어도 예산이 닫히도록 8 로 잡았다 (4 x 8 = 32).
      #
      # 최소를 최대와 같게 두면 안 된다. 그러면 새로 뜬 인스턴스가 요청 하나 받기 전에 8 을
      # 먼저 잡는데, 스케일 아웃이 도는 때가 곧 트래픽이 몰려 DB 도 바쁜 때다. 가장 빡빡한
      # 순간에 아무 일도 안 하는 커넥션이 예산에서 빠져나간다.
      #
      # 그래서 2 로 시작해 실제 트래픽만큼 8 까지 늘게 둔다. 늘리는 값을 사용자 요청이 물지
      # 않는다. 스케일 아웃 인스턴스는 어차피 JVM 기동과 ALB 헬스 체크를 기다리므로 트래픽을
      # 받기 전에 하우스키퍼가 채운다.
      #
      # 최대 8 이 처리량을 깎지는 않는다. DB 가 db.t4g.micro(2코어)라 동시에 쓸모 있게 처리하는
      # 문장 수가 5 안팎인데 3대 x 8 이면 이미 그 위다. 줄어드는 것은 DB 안에 서는 줄이다.
      #
      # 예산 표는 docs/resource-budget.md 에 있다.
      maximum-pool-size: 8
      minimum-idle: 2
      # URL 에 붙이지 않고 여기서 준다. 어떤 URL 이 와도 값이 유지된다
      data-source-properties:
        connectTimeout: 3000
        socketTimeout: 10000
        # 아래 셋은 위 url 의 기본값 문자열에도 적혀 있지만 운영에서는 안 쓰였다.
        # ${DB_URL:...} 문법이라 환경 변수가 있으면 콜론 뒤가 통째로 버려지는데,
        # 운영은 compose 가 DB_URL 을 주입하기 때문이다. 그래서 로컬에서만 적용돼 왔다.
        #
        # rewriteBatchedStatements 가 없으면 jdbcTemplate.batchUpdate 로 묶은 배치를
        # 드라이버가 건별 INSERT 로 풀어 보낸다. 1차 부하 시험(2026-08-30)에서 494 행이
        # 495 개의 INSERT 문으로 나갔다. 플러시는 14 번 돌며 회당 약 35 행을 모았는데
        # (COMMIT 14 회) 그 35 건이 각각 왕복했다. 발급이 재고만큼 나가기 시작하면
        # 이 왕복이 그대로 플러시 스레드의 병목이 된다.
        #
        # characterEncoding 과 serverTimezone 은 지금 동작을 바꾸지 않는다. RDS 실측이
        # character_set_server=utf8mb4, time_zone=UTC 라 드라이버가 추론하는 값과 같다.
        # 명시하는 것은 파라미터 그룹이 바뀌었을 때 조용히 깨지지 않게 하려는 것이다.
        rewriteBatchedStatements: true
        characterEncoding: UTF-8
        serverTimezone: UTC

  jpa:
    # 스키마는 Flyway 가 소유한다. Hibernate 는 어긋나면 기동을 막는 역할만 한다
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  # 로그인 state/nonce, access token valid-after 커트라인, refresh token 회전이 이 캐시를 쓴다.
  # 엔진은 Valkey 이고 프로토콜이 같아 spring.data.redis 설정을 그대로 쓴다 (compose.yaml 참고).
  # 변수명을 compose 와 맞춘다. 한쪽만 바꾸면 컨테이너와 앱이 서로 다른 포트를 본다
  data:
    redis:
      host: "${VALKEY_HOST:localhost}"
      port: "${VALKEY_PORT:6379}"
      # 인증 경로가 요청마다 이 캐시를 찌른다.
      # 값을 주지 않으면 Lettuce 기본이 커맨드 60초, 연결 10초라
      # 캐시가 죽는 게 아니라 느려지기만 해도 톰캣 스레드가 그만큼 묶인다.
      # DB 쪽은 socketTimeout 10초로 이미 막아 두었는데 여기만 비어 있었다.
      #
      # 단일 GET/SET/INCR 이고 같은 VPC 안이라 정상 지연은 1밀리초 아래다.
      # 1초는 그 1000배라 정상 요청을 자를 여지가 없으면서 스레드 점유를 끊는다.
      timeout: 1s
      connect-timeout: 1s

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: "${KAKAO_CLIENT_ID}"
            client-secret: "${KAKAO_CLIENT_SECRET}"
            authorization-grant-type: authorization_code
            redirect-uri: "${KAKAO_REDIRECT_URI:http://localhost:5173/oauth/callback}"
            scope: openid
        provider:
          kakao:
            issuer-uri: https://kauth.kakao.com
            user-info-uri: https://kapi.kakao.com/v1/oidc/userinfo
            user-name-attribute: sub

  lifecycle:
    # 종료 타임아웃 계층의 안쪽에서 셋째다. compose 45초, systemd 60초가 바깥이다
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  # 처리 중인 요청을 마치고 내려간다. 대상 그룹 해제 지연 30초와 짝을 이룬다
  shutdown: graceful
  tomcat:
    threads:
      max: 200

# 액추에이터를 8081 로 분리한다.
# 8080 에 /actuator 경로가 존재하지 않게 되어 밖에서 막을 규칙이 필요 없다.
# 근거는 infra 의 기술스택 확정문서 4.2절에 있다.
management:
  server:
    port: 8081

  endpoints:
    web:
      exposure:
        include: health, info, prometheus

  endpoint:
    health:
      # liveness 와 readiness 를 나눈다. 기동 중인 앱은 살아 있지만 준비되지 않았다
      probes:
        enabled: true
      # 밖에서 볼 수 있으므로 상세를 숨긴다
      show-details: never
      group:
        # 공유 의존성을 넣지 않는다 (INF-16).
        # DB 가 흔들리면 전 인스턴스가 동시에 대상 그룹에서 빠져 서비스가 통째로 끊긴다
        readiness:
          include: diskSpace

  metrics:
    tags:
      application: "${APP_NAME:freshmarket}"
      instance: "${APP_INSTANCE_ID:local}"

  tracing:
    sampling:
      # 장애 주입 실험 직전에 100% 로 올릴 수 있어야 한다
      probability: "${TRACE_SAMPLE_RATE:0.1}"

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173}"

# 이미지 URL 앞에 붙는 주소다. 운영은 CloudFront 도메인이 CDN_BASE_URL 로 들어온다
# (infra 의 terraform/templates/compose.yaml.tftpl).
#
# 기본값을 비워 둔다. 로컬에는 오브젝트 스토리지가 없어 어차피 이미지가 열리지 않는데,
# 여기에 localhost 를 적어 두면 운영에서 값이 빠졌을 때 그 주소가 응답에 실려 나간다.
cdn:
  base-url: "${CDN_BASE_URL:}"

# 상품 이미지 업로드(#21)가 쓰는 S3 버킷. presigned PUT 발급과 HeadObject 확인에 쓰인다
# (fm-infra 백엔드공통_이미지저장소_설계.md 6.2절). 버킷은 terraform/storage.tf의
# aws_s3_bucket.media, 리전은 기술스택 확정값(ap-northeast-2)이 기본값이다.
s3:
  region: "${S3_REGION:ap-northeast-2}"
  media-bucket: "${S3_MEDIA_BUCKET:}"
  # presigned PUT의 유효 시간. 인프라 문서 예시(300초)를 기본값으로 둔다
  presigned-url-expiry-seconds: "${S3_PRESIGNED_URL_EXPIRY_SECONDS:300}"

# 업로드 검증 상한(SEC-3-04). 등급 C 추정치라 나중에 재검토될 수 있다
# (같은 문서 "업로드 크기 상한" 절 — product_image 1MB).
upload:
  product-image:
    max-size-bytes: "${UPLOAD_PRODUCT_IMAGE_MAX_SIZE_BYTES:1048576}"
    allowed-content-types: "${UPLOAD_PRODUCT_IMAGE_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,image/webp}"
    # PendingProductImageCleanupService(INF-11-13)가 이 시간을 넘긴 PENDING 행을 정리한다.
    # 등급 C 추정치다 — presigned URL 자체는 5분(s3.presigned-url-expiry-seconds)이면 만료되지만,
    # 업로드는 그 안에 성공하고도 확정 통지만 유실될 수 있어 더 넉넉히 잡는다. 배치가 하루 한 번만
    # 돌게 되면서(PendingProductImageCleanupScheduler), 24시간까지 여유를 둘 필요는 없어져 3시간으로
    # 줄였다 — 그래도 정상적인 확정 지연(수 분 내) 대비로는 충분히 넉넉하다.
    pending-cleanup-grace-hours: "${UPLOAD_PRODUCT_IMAGE_PENDING_CLEANUP_GRACE_HOURS:3}"
    # AdminProductImageService.resolveStalePending()이 같은 상품에 업로드 URL을 다시 발급할 때
    # 이 시간을 넘긴 그 상품의 PENDING 행을 곁다리로 확인한다. 새 스케줄러가 아니라 이미 일어나는
    # 요청에 얹는 것이라, presigned URL 만료(5분)보다만 여유 있게 잡으면 된다.
    stale-pending-minutes: "${UPLOAD_PRODUCT_IMAGE_STALE_PENDING_MINUTES:10}"

jwt:
  secret: "${JWT_SECRET}"
  access-token-validity-ms: "${JWT_ACCESS_VALIDITY_MS:1800000}"
  refresh-token-validity-ms: "${JWT_REFRESH_VALIDITY_MS:1209600000}"
  cookie:
    secure: "${JWT_COOKIE_SECURE:false}"

kakao:
  app-id: "${KAKAO_APP_ID}"
  admin-key: "${KAKAO_ADMIN_KEY}"

# 카카오 OIDC 외부 API(로그인 토큰교환/로그아웃/unlink) 서킷브레이커.
# 인스턴스를 API별로 나눈다 — 하나가 막혀도 다른 API까지 같이 막히지 않는다.
# config는 트래픽 양에 따라 두 종류로 나눈다 — 값만 공유할 뿐 상태(open/closed)는
# 인스턴스별로 독립이다. 이름을 하나로 합치지 않는 한 세 서킷은 절대 같이 안 열린다.
#
# (2026-08-27, PR 리뷰 P1) 원래 셋 다 kakao-common(60초/최소 5회) 하나를 같이 썼는데,
# login은 트래픽이 꾸준해 60초에 5회가 쉽게 채워지지만 unlink는 10분 배치, logout은
# 사용자 행동 기반이라 60초 윈도우에 5통이 쌓이는 일 자체가 드물다 — 그러면 5xx가
# 반복돼도 minimumNumberOfCalls를 못 채워 failureRateThreshold가 영원히 계산 안 되고
# 서킷이 열리지 않는다. 그래서 unlink/logout은 windows를 5분으로 늘리고
# minimumNumberOfCalls를 3으로 낮춘 kakao-low-traffic을 따로 쓴다.
resilience4j:
  circuitbreaker:
    configs:
      kakao-common:
        slidingWindowType: TIME_BASED
        slidingWindowSize: 60              # 최근 60초
        minimumNumberOfCalls: 5            # 트래픽 뜸한 시간대에 소수 실패로 오탐 열리는 것 방지
        failureRateThreshold: 50
        slowCallDurationThreshold: 3s      # WebClientConfig의 connect timeout과 맞춘 기준
        slowCallRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 1
        maxWaitDurationInHalfOpenState: 5s
        # 트래픽이 뜸한 API라 백그라운드 스레드로 자동 전환할 필요가 없다 —
        # waitDuration이 지난 뒤 다음 실제 요청이 half-open 전환 여부를 판단한다
        automaticTransitionFromOpenToHalfOpenEnabled: false
        # /actuator/health에 묶지 않는다
        # 카카오 장애는 우리 배포/DB/주문과 무관한 제3자 장애라
        # 이걸로 health를 DOWN시키면 배포 스모크나 ALB가 엉뚱하게 반응한다.
        # 상태 확인은 Micrometer/Prometheus로 한다.
        registerHealthIndicator: false
        eventConsumerBufferSize: 100
      kakao-low-traffic:
        slidingWindowType: TIME_BASED
        slidingWindowSize: 300             # 최근 5분 — unlink 10분 배치/logout 사용자 행동
                                            # 기반이라 60초로는 minimumNumberOfCalls도 못 채운다
        minimumNumberOfCalls: 3
        failureRateThreshold: 100          # 호출 자체가 뜸해서 낮은 임계값이면 소수 실패로
                                            # 오탐 열릴 수 있다 — 최근 3회가 전부 실패했을 때만 OPEN
        slowCallDurationThreshold: 3s
        slowCallRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 1
        maxWaitDurationInHalfOpenState: 5s
        automaticTransitionFromOpenToHalfOpenEnabled: false
        registerHealthIndicator: false
        eventConsumerBufferSize: 100
    instances:
      kakaoLogin:
        base-config: kakao-common
      kakaoLogout:
        base-config: kakao-low-traffic
      kakaoUnlink:
        base-config: kakao-low-traffic

      # 선착순 발급이 쓰는 회로 둘이다. 값의 근거는 docs/coupon/coupon.md 9장에 있다.
      #
      # 창을 시간 기준으로 두는 것이 이 설정의 요점이다. 건수 기준이면 유입이 빠를수록 판정
      # 근거의 시간 폭이 좁아진다. 초당 2천이면 100건이 50밀리초 어치라, GC 정지 하나가 창을
      # 통째로 덮어 회로가 열린다. 실제로 그렇게 무너졌다 (2026-08-30 부하 시험, 최대 정지
      # 330밀리초, 느린 호출 비율 100%, 발급 7,281건에서 295건으로). 10초 창이면 3% 라 묻힌다.
      couponSeq:
        slidingWindowType: TIME_BASED
        slidingWindowSize: 10
        # 시간 창이라 표본이 많다. 이벤트가 없을 때 소수 호출로 열리는 것을 막는다
        minimumNumberOfCalls: 100
        failureRateThreshold: 50
        # 느림으로는 열지 않는다. 100 은 "모든 호출이 느려야 연다" 라 사실상 끈 것이다.
        #
        # 이 회로가 재는 것은 Redis 왕복이 아니라 executeCallable 이 도는 시간 전체다.
        # 거기에는 가상 스레드가 CPU 를 얻기까지 기다린 시간이 들어간다. 그런데 Redis 왕복은
        # 이미 timeout 100ms 로 묶여 있으므로, 100ms 를 넘는 측정값은 정의상 Redis 가 아니라
        # 이 앱의 지연이다.
        #
        # 그래서 느림 문턱을 타임아웃 아래에 두면 Redis 상태가 아니라 자기 CPU 여유를 보게 된다.
        # 실측이 그랬다 (2026-08-30). 차가운 JVM 의 정상 회차에서 느린 호출 비율이 69% 였고
        # 실패 비율은 0% 였다. 임계가 50% 였으니 열렸을 텐데, 그 회차는 10,000건을 다 발급하고
        # 실패가 0건이었다. 성공한 호출의 최대가 792ms 였던 것이 근거다. Redis 가 792ms 를
        # 썼다면 타임아웃에 걸려 실패했어야 한다.
        #
        # Redis 가 진짜 죽으면 타임아웃에서 실패로 확정되어 위 failureRateThreshold 가 잡는다.
        slowCallRateThreshold: 100
        # 문턱은 50ms 로 남겨 둔다. 이 값으로는 회로가 안 열리지만, slow_call_rate 지표가
        # 계속 나와 "지금 이 인스턴스가 데워졌나" 를 보는 데 쓸 수 있다. 데워지면 0%,
        # 차가우면 69% 였다.
        slowCallDurationThreshold: 50ms
        # 90초짜리 이벤트에서 10초를 닫아 두면 그것만으로 11% 를 잃는다. 여는 것을 막는 값이
        # 아니라 회복을 얼마나 빨리 알아채느냐를 정하는 값이다
        waitDurationInOpenState: 3s
        # 회복 판정에 쓰는 표본이다. 5 면 초당 2천에서 2.5밀리초 어치라 그 다섯의 운에 걸린다
        permittedNumberOfCallsInHalfOpenState: 30
        # 발급이 몰리는 구간이라 다음 요청이 올 때까지 전환을 미루지 않는다
        automaticTransitionFromOpenToHalfOpenEnabled: true
        # 캐시 장애로 health 가 DOWN 되면 ALB 가 인스턴스를 빼 상황이 악화된다 (INF-4-01)
        registerHealthIndicator: false
        eventConsumerBufferSize: 100

      # DB 쓰기 회로다. DB 가 죽어도 Redis 는 멀쩡해 위 회로가 안 열리기 때문에 따로 둔다.
      couponWrite:
        slidingWindowType: TIME_BASED
        slidingWindowSize: 10
        # 플러시 스레드가 하나라 쓰기가 한 번에 하나씩 돈다. 초당 50번 남짓이라 100 은 못 채운다
        minimumNumberOfCalls: 20
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        # socketTimeout 250ms 보다 뒤에 둔다. 그보다 짧게 잡으면 DB 가 아니라 이 앱의 지연을
        # DB 장애로 읽는다 (위 couponSeq 주석과 같은 이유).
        #
        # 150ms 였을 때 차가운 JVM 의 정상 회차에서 느린 호출 비율이 0.9% 였다. 아직 임계
        # 50% 와는 멀지만 성공한 호출의 최대가 733ms 라, 부하가 세지면 비율이 오른다.
        slowCallDurationThreshold: 300ms
        waitDurationInOpenState: 3s
        permittedNumberOfCallsInHalfOpenState: 30
        automaticTransitionFromOpenToHalfOpenEnabled: true
        registerHealthIndicator: false
        eventConsumerBufferSize: 100
        # 무엇을 실패로 세느냐가 이 회로의 요점이다. 여기 적힌 것만 센다.
        #
        # DuplicateKeyException 을 세면 이벤트가 정상일 때 회로가 열린다. 재시도와 매핑 유실로
        # 중복이 꾸준히 나오는 것이 이 설계의 정상 동작이기 때문이다. BadSqlGrammarException 도
        # 안 센다. 그것은 버그이고, 세면 회로가 열린 뒤 영영 안 닫힌다.
        #
        # 스프링의 TransientDataAccessException 만으로는 부족하다. 커넥션을 못 얻은 실패를
        # 스프링은 비일시적으로 분류하는데, Multi-AZ 페일오버는 60~120초 뒤에 끝나므로 여기서는
        # 일시적이다. 그래서 DataAccessResourceFailureException 을 함께 적는다.
        recordExceptions:
          - org.springframework.dao.DataAccessResourceFailureException
          - org.springframework.dao.TransientDataAccessException
          - org.springframework.dao.RecoverableDataAccessException
