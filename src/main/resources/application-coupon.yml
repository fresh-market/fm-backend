# 선착순 쿠폰 발급 전용 인스턴스 설정이다. prod 와 함께 켠다.
#
#   --spring.profiles.active=prod,coupon
#
# 4장이 ALB 경로로 ASG 를 갈랐으므로 이 프로필은 그 전용 ASG 에서만 켠다.
# 프로필을 켜는 것은 fm-infra 쪽 일이고, 이 파일은 켜졌을 때의 값만 갖는다.
#
# 값의 근거는 docs/coupon/coupon.md 5장(커넥션 예산)과 7장(요청 예산), 9장(RDB 장애)에 있다.
# 전부 부하 시험에서 옮길 시작값이다.

spring:
  # 요청 스레드가 하는 일이 Redis 왕복 하나를 빼면 큐에서 잠들어 있는 것뿐이다.
  #
  # 커널 스레드로 두면 그 잠듦과 깨어남이 전부 컨텍스트 스위칭이다. 플러시 스레드가 배치
  # 하나로 최대 500 개의 future 를 한꺼번에 완료시키므로, 그때마다 커널이 500 번 깨운다.
  # 초당 50 배치면 2만 5천 번이다. 가상 스레드는 캐리어 몇 개 위에 마운트만 해서 커널이
  # 안 끼어든다.
  #
  # threads.max: 200 은 넘을 수 없는 벽이 아니라 커널 스레드가 비싸서 그 정도로 잡아 둔
  # 값이다. 가상 스레드를 켜면 그 설정 자체가 안 쓰인다.
  #
  # 대가로 큐 길이의 자연 상한이 사라진다. 플랫폼 스레드일 때는 요청 스레드 수가 곧 큐
  # 길이의 상한이었는데 그것이 없어지므로, 앱이 coupon.issue.queue-capacity 로 직접 건다.
  threads:
    virtual:
      enabled: true

  datasource:
    hikari:
      # 예산에서 역산하지 않고 이 인스턴스가 실제로 쓰는 수를 세어 잡았다.
      #
      #   플러시 스레드   1   DB 에 쓰는 것은 이것뿐이다 (flush-threads: 1)
      #   캐시 적재      1   AsyncCache 가 단일 비행이라 쿠폰당 하나만 DB 로 간다
      #   발급 요청      0   트랜잭션을 안 연다. 큐에 넣고 결과를 기다릴 뿐이다
      #
      # 요청이 2만 개여도 커넥션 수요가 안 느는 것이 이 설계의 요점이라 2 로 족하다.
      #
      # 크게 잡으면 안 되는 이유가 따로 있다. 풀이 크면 대기가 DB 안으로 들어가 전부 조금씩
      # 느려지고, 앱은 그것을 혼잡이 아니라 느림으로 겪는다. 그러면 아래 connection-timeout 도
      # 회로도 늦게 반응한다. 선착순은 전부를 느리게 하는 대신 일부를 빠르게 거절하기로 한
      # 설계라(9장), 대기를 앱의 풀 앞에 세워 두어야 그 선택이 성립한다.
      #
      # 관리자 API 는 세지 않는다. ALB 가 발급 경로만 이 전용 ASG 로 보내므로 이벤트를 여는
      # 트랜잭션과 닫는 트랜잭션은 일반 인스턴스에서 돈다. 컨트롤러가 여기 등록만 되어 있고
      # 요청은 안 온다.
      #
      # DB 가 db.t4g.micro(2코어)라 동시에 쓸모 있게 처리하는 문장 수가 5 안팎이다.
      # 스레드를 늘려 그 위로 올려 봐야 줄이 DB 안으로 옮겨갈 뿐이다.
      # flush-threads 를 올린다면 이 값도 함께 올린다.
      #
      # 최소를 1 로 두는 것은 상시 수요가 하나여서다. 이벤트가 도는 동안 커넥션을 계속 쓰는 것은
      # 플러시 스레드 하나이고, 캐시 적재는 5초마다 잠깐 빌렸다 놓는다. 둘이 겹치지 않는 동안에는
      # 커넥션 하나가 둘을 다 받아 낸다. 그래서 이벤트가 없을 때 이 인스턴스는 하나만 쥔다.
      #
      # 둘째 커넥션은 플러시가 하나를 빌려 간 순간에 만들어진다. minimum-idle 은 총 개수가 아니라
      # 유휴 개수의 하한이라, 빌려 가서 유휴가 비면 Hikari 가 그 하한을 회복하려고 하나 더 만든다.
      # 그래서 이벤트 중에는 사실상 2 로 산다. minimum-idle 이 maximum 보다 작아져 이제 살아난
      # idle-timeout(기본 10분)이 이벤트가 끝난 뒤에 그것을 반납하므로, 전용 3대면 이벤트 사이에
      # 커넥션 셋이 예산으로 돌아간다.
      #
      # 대가는 그 둘째를 만드는 시간이다. 다만 풀 획득 상한이 기준선의 3초라 같은 VPC 안에서
      # 커넥션을 세우는 밀리초 단위 시간은 그 안에 넉넉히 든다. 이벤트 시작 직후는 큐가 비어
      # 플러시가 놀고 있어 겹칠 일이 없고, 겹침은 트래픽이 붙은 뒤에 나므로 그때는 이미 둘이 서 있다.
      maximum-pool-size: 2
      minimum-idle: 1

      # 각 값이 무엇을 재는 시계인지는 application.yml 의 같은 자리에 적어 두었다.
      # 여기서는 그 값을 이 경로에 맞게 다시 잡은 근거만 적는다.
      #
      # 이 넷 중 요청 스레드가 직접 무는 것은 없다. 요청 스레드는 순번을 받아 큐에 넣고 future 를
      # 기다릴 뿐이고, 커넥션을 얻어 쓰는 것은 플러시 스레드다. 캐시가 빌 때만 요청 스레드가
      # 이 값들 아래에서 DB 를 기다린다.
      #
      # 계층이 역전되면 안 된다 (7장).
      #
      #   commit-wait 800ms  >  connection-timeout 300 + socketTimeout 300 = 600
      #
      # 안쪽이 더 길면 요청 스레드가 먼저 포기해 혼잡으로 답한 뒤에 그 배치가 커밋된다.
      # 실패했다고 답했는데 발급된 상태가 되고, 사용자가 안 돌아오면 그 쿠폰은 쓰이지 않는다.
      #
      # 풀에서 커넥션을 얻기까지 기다리는 상한. 못 얻으면 SQLTransientConnectionException.
      #
      # 정상 부하에서는 안 물린다. 소비자가 플러시 1 + 캐시 적재 1 이고 풀도 2 라 경합이 없다
      # (실측 대기 스레드 0, 타임아웃 0). 물리는 것은 DB 가 죽어 커넥션 생성이 안 될 때다.
      # 그때 이 값이 생성 재시도 루프를 끊는다. connectTimeout 은 시도 한 번을 끊고 이쪽은
      # 루프 전체를 끊는다.
      #
      # 250 보다 작게 못 잡는다. HikariCP 가 하한 250ms 를 강제하고 그보다 작은 값은 경고와
      # 함께 조용히 250 으로 덮어쓴다. 적힌 값과 도는 값이 갈리면 계층 계산이 거짓이 된다.
      connection-timeout: 300

      # validation-timeout 은 여기 두지 않는다. application.yml 의 1s 를 그대로 물려받는다.
      #
      # 적어도 뜻이 없기 때문이다. HikariCP 가 Connection.isValid(int seconds) 에 넘기려고
      # Math.max(1000, validationTimeout) / 1000 으로 바꾼다. 즉 1초가 하한이라 300 이라고
      # 적어도 실제로는 1초로 돈다. 적힌 값과 도는 값이 갈리는 것을 피해 아예 안 적는다.
      #
      # 그 1초를 connection-timeout 이 못 끊는다. HikariPool 이 검증을 마친 뒤에야 남은 예산을
      # 다시 계산한다. 그래서 borrow 한 번이 commit-wait 을 넘길 수 있다. 다만 검증은 500ms
      # 넘게 논 커넥션에만 돌고(aliveBypassWindow) 건강하면 1ms 에 끝나므로, 1초를 다 쓰는
      # 것은 DB 가 응답을 안 할 때뿐이다. 그때는 끊기는 것이 맞다.

      data-source-properties:
        # 접속을 세우는 상한. 기본값 0(무제한)이라 끄면 안 된다
        connectTimeout: 250
        # 세워진 소켓에서 읽기 한 번의 상한. 쿼리 전체가 아니다.
        #
        # 250 에서 300 으로 올린다. 250 으로도 실패가 0건이었으므로 줄일 이유는 없고,
        # commit-wait 800 - connection-timeout 300 = 500 안에 들어가 계층이 유지된다.
        #
        # 기본값이 0(무제한)이라 끄면 매달린 쿼리 하나가 플러시 스레드를 영영 묶고 큐 전체가
        # 굶는다. flush-threads 가 1 이라 스레드가 그것뿐이다.
        socketTimeout: 300

  data:
    redis:
      # 이미 세워진 연결 위로 명령을 보내고 응답을 기다리는 상한. 접속을 세우는 시간이 아니다.
      # 그쪽은 connect-timeout 이고, 위 DB 의 socketTimeout 과 connectTimeout 에 각각 대응한다.
      #
      # 이 값은 commit-wait 밖이라 응답 시간에 그대로 더해진다. 그리고 발급 요청 하나가 Redis 를
      # 두 번 친다.
      #
      #   JwtAuthenticationFilter  -> 인증 커트라인 조회 (GET)
      #   CouponSeqAllocator       -> 순번 확보 (EVALSHA)
      #
      # 그래서 8장의 SLO(처리된 응답 p99 1초)가 이 값의 상한을 정한다.
      #
      #   100ms x 2 + commit-wait 800ms = 1,000ms
      #
      # 더 조이면 안 되는 이유가 따로 있다. 이 타임아웃은 벽시계 기준이라 이벤트 루프가 GC 나
      # CPU 포화로 멈춘 시간이 그대로 들어간다. Redis 가 한가해도 앱이 바쁘면 걸린다. 회로의
      # 느림 판정이 같은 이유로 오판했다 (2026-08-30, 차가운 정상 회차에서 50ms 초과 69%).
      # 걸리면 congested-seq-unavailable 503 이고, 503 은 재시도를 불러 부하를 되먹인다.
      timeout: 100ms

      # 접속을 세우는 상한. 부하 경로에는 없다.
      # Lettuce 가 커넥션 하나를 공유하고 명령을 다중화하므로 접속은 기동 때와 재접속 때만
      # 일어난다. 요청이 2만이어도 인스턴스당 연결은 하나다. application.yml 의 값을 물려받는다.

# 3장이 "재서 정할 값" 으로 잡은 것들이다. 시작값을 박아 두고 부하 시험에서 옮긴다
coupon:
  issue:
    # 커밋되지 않은 순번을 소진 시점에 회수하는 기준.
    # 요청 예산보다 길어야 아직 살아 있는 요청의 번호를 안 뺏는다
    reclaim-after: 60s

    # 첫 항목을 꺼낸 뒤 이만큼 더 모으고 플러시한다. 둘 중 먼저 오는 것에서 끊는다.
    #
    # 정상 상태에서 배치를 끊는 것은 창이다. 배치 크기 = 도착률 x 창이라,
    #
    #     150/s x 20ms =   3건      로컬 리허설에서 실제로 이랬다
    #   1,000/s x 20ms =  20건
    #  25,000/s x 20ms = 500건      여기 와야 batch-size 가 처음 물린다
    #
    # 그래서 batch-size 는 튜닝 레버가 아니라 밀린 뒤의 복구 상한이다. 플러시가 멈춰 있다
    # 재개하면 drainTo 가 500 을 집어 즉시 나가고, INSERT 한 문장이 만 행이 되는 것을 막는다.
    #
    # 창은 요청 예산 800ms 의 2.5% 라 사실상 공짜다. 늘리면 배치가 커지는 대신 모든 요청이 그만큼
    # 더 기다린다. rewriteBatchedStatements 로 20건짜리 다중행 INSERT 도 이미 단건 20번보다
    # 훨씬 나으므로, 20 에서 500 으로 가는 이득은 생각보다 작다.
    batch-window: 20ms
    batch-size: 500

    # 1 로 둔다. 이 값이 곧 DB 에 동시에 쓰는 수라 커넥션 풀이 이 값에 묶여 있다.
    #
    # 로컬 리허설에서 플러시는 병목이 아니었다. 초당 50번 플러시에 배치가 두어 건이었고
    # 커넥션 대기가 0이었다. 병목이 아닌 것을 먼저 올릴 이유가 없다.
    #
    # 올린다면 maximum-pool-size 와 함께 올린다. 한쪽만 올리면 스레드가 커넥션을 못 얻어
    # 아무것도 안 달라진다. 다만 DB 가 2코어라 동시에 쓸모 있게 처리하는 문장 수가 5 안팎이고,
    # 그 위로는 줄이 DB 안으로 옮겨갈 뿐이다.
    flush-threads: 1

    # 요구 부하의 사람 수와 같은 값에서 시작한다. 2만 명이 전부 동시에 큐에 들어와도 안 막는
    # 값이라, 여기서 줄여가며 거절이 시작되는 지점을 찾는다.
    #
    # 이 값은 앱이 급사했을 때 잃는 건수의 상한이기도 하다.
    # 시험에서 20000 -> 10000 -> 5000 -> 2500 -> 1000 으로 줄여간다.
    #
    # 톰캣의 max-connections 는 안 건드린다. 스프링 기본값 8192 가 그대로 상한이고, 그것이
    # 실제로 물리는지는 부하 발생기를 분리한 시험에서 본다. 요청 예산이 2초라 동시에 떠 있는
    # 요청은 도착률 x 2초로 묶이는데, keep-alive 유휴 연결은 그것과 무관하게 남아 있다.
    queue-capacity: 20000

    # 요청 스레드가 자기 발급의 확정을 기다리는 시간. 넘으면 혼잡으로 끊는다.
    #
    # 재는 구간은 큐에 넣은 뒤부터다. 순번 확보는 이 안에 없다.
    #
    #   queue.submit  ->  큐 대기  ->  INSERT + COMMIT  ->  markCommitted  ->  future 완료
    #
    # DB 커밋과 Redis 확정 표시가 모두 끝나야 깨운다. 순서를 뒤집으면 응답을 받은 사용자의
    # 재시도가 표시보다 먼저 도착해 DB 까지 간다. 그래서 이름이 flush 가 아니라 commit 이다.
    #
    # 한때 request-budget 이었다. 그 이름이 "요청 시간 = 예산 + Redis" 를 전제하게 만들어
    # 800 + 200 = 1000 이라는 계산을 낳았는데, 빠진 항이 있었다. CPU 스케줄 대기다. 차가운
    # 회차에서 HTTP p95 가 1.02초였는데 예산 초과는 0건이었다. 그 1.02초의 대부분이 이 구간
    # 밖에 있었다는 뜻이다. 이름이 재는 구간만 가리키도록 바꾼다.
    #
    # 800ms 인 이유는 두 가지가 함께 성립하는 값이라서다.
    #
    #   SLO      redis.timeout 100 x 2 + 800 = 1,000ms  <=  8장의 p99 1초
    #   계층     800  >  connection-timeout 300 + socketTimeout 300 = 600
    #
    # reclaim-after(60s) 보다 짧아야 한다. 아직 응답을 기다리는 요청의 번호를 회수가 남에게
    # 주면 같은 순번이 두 사람에게 나가고 uk_mc_coupon_seq 에 걸린다.
    # CouponIssueProperties 가 그 순서를 생성자에서 강제한다.
    #
    # 이 값은 총 발급량을 안 바꾼다. 넘겨서 503 을 받은 요청도 티켓이 큐에 남아 결국 써진다.
    # 바꾸는 것은 그 발급을 성공으로 세느냐다. 짧게 잡으면 "실패했다고 답했는데 발급된" 건이
    # 늘고, 그 사용자가 안 돌아오면 그 쿠폰은 아무도 안 쓴다.
    commit-wait: 800ms

    # Redis 재건을 주도하는 인스턴스가 남들이 자기 큐를 올리기를 기다리는 시간 (coupon.md 10장).
    #
    # 이 기다림은 free 하나 때문에 있다. seq 와 counter 와 pending 은 각자 자기 것만 알면 되는데,
    # free 는 "아무도 안 쥔 번호" 라 전부를 알아야 한다. 해시가 회원 -> 순번이라 번호로는 주인을
    # 역으로 못 찾는다.
    #
    # 인스턴스가 살아 있으면 밀리초에 끝난다. 이 값은 죽었거나 느린 인스턴스를 언제 포기할지를
    # 정하는 것이고, GC 정지(실측 104~330ms)와 배치 하나가 끝나는 시간을 덮을 만큼이면 된다.
    #
    # 길게 잡으면 그만큼 발급이 멈춰 있고, 짧게 잡으면 느린 인스턴스가 쥔 번호를 남에게 내준다.
    # 그때도 uk_mc_coupon_seq 가 막으므로 초과 발급은 안 나고, 그 인스턴스의 요청들이 실패한다.
    rebuild-contribute-wait: 3s

    # 마감이 없는 쿠폰의 스냅샷을 이 JVM 이 들고 있는 시간.
    #
    # 선착순 쿠폰은 이 값을 안 쓴다. 스냅샷이 Redis 키와 같은 시각(issue_end_at + 1분)에 죽는다.
    # 그 시각에 맞추는 이유는 스냅샷이 설명하는 대상이 그때 사라지기 때문이다. 더 들고 있으면
    # 없는 이벤트를 설명하는 값이고, 먼저 버리면 발급 창 안에서 얼어붙은 값을 다시 읽는 것이라
    # DB 조회만 는다. 거는 자리는 CouponCache 이고 식은 CouponSeqInitializer.keysExpireAt 하나다.
    #
    # 마감이 없는 쿠폰은 Redis 키에도 만료가 안 걸려 맞출 기준이 없다. 그래서 이 값이 남는다.
    coupon-cache-ttl: 5s

  # 기동 직후 발급 경로를 데운다. CouponWarmupRunner 가 읽는다.
  #
  # 차가운 JVM 은 요청을 처리하면서 동시에 자기를 컴파일한다. 90초짜리 이벤트에서 49.7초어치를
  # 컴파일했고 그만큼이 요청 처리에서 빠졌다. 실측 차이가 이만큼이다
  # (2026-08-31, VU 20,000 / 재고 10,000 / t3.small 3대).
  #
  #   워밍업 없음      p99 4.69초
  #   워밍업 3,000건   p99 0.288 ~ 0.939초 (표본 5, 모두 SLO 1초 통과)
  #
  # 러너가 ApplicationRunner 라 ApplicationReadyEvent 앞에 돈다. 스프링 부트가 그 이벤트에서
  # readiness 를 올리므로, 여기서 데우면 readiness 가 자연히 늦춰진다. 그래서
  # coupon-event.sh open 의 "healthy 대기" 가 곧 "warm 대기" 가 되고 스크립트는 안 바뀐다.
  warmup:
    enabled: true
    # 전용 쿠폰(V33). 러너가 카운터를 소진 상태로 세워 두어 member_coupon 에 아무것도 안 쓴다
    coupon-id: 1000000
    # 3,000 에서 p99 가 1초 아래로 떨어졌다. 200 으로는 모자랐다 (최대 응답 1.72초)
    requests: 3000
    # 순차로 보내면 실제 이벤트의 동시성을 못 흉내 낸다
    concurrency: 20
    # 못 채워도 이 시간에 끝낸다. 없으면 readiness 가 영영 안 올라가고 ASG 가 교체를 반복한다.
    # 3,000건이 약 30초였다. health_check_grace_period 300초 안에 넉넉히 들어간다
    max-duration: 60s
