# 배치 전용 인스턴스 설정이다. prod 와 함께 켠다.
#
#   --spring.profiles.active=prod,batch
#
# 스케줄러는 이 프로필에서만 돈다 (INF-1-10).
# 앱 인스턴스는 prod 만 켜서 스케줄러를 재운다. 분산 락이 없어 중복 실행을 막을 다른 수단이 없다.

spring:
  datasource:
    hikari:
      # 이 인스턴스가 동시에 쓰는 커넥션은 하나다.
      #
      #   스케줄 작업   1   spring.task.scheduling.pool.size 기본값이 1 이라 여덟 작업이 한 줄로 돈다
      #   헬스 지표     1   사람이 /actuator/health 를 칠 때만. SELECT 1 한 번이다
      #   기동 준비     1   Flyway 와 스키마 검증. 트래픽 전이라 겹칠 상대가 없다
      #
      # 같은 시각에 걸린 작업이 있어도(03:00 과 04:00 에 둘씩) 수요는 안 는다.
      # 스케줄러 스레드가 하나라 뒤엣것이 앞엣것을 기다리기 때문이다.
      #
      # 그래서 최대를 4 로 잡는다. 작업이 돌 때 실제로 앉는 자리는 2(작업 1 + 유휴 1)이고,
      # 그 위에 max-lifetime 이 커넥션을 교체하는 동안의 여유와 운영자 한 자리를 얹은 값이다.
      #
      # 10 으로 두면 나중에 누가 스케줄러를 동시 실행으로 바꿔도 풀이 조용히 삼켜서 그 변화가
      # 안 보인다. 4 면 pending 지표에 드러난다.
      #
      # 최소를 1 로 두는 것이 이 설정의 요점이다. 배치는 하루 대부분 놀면서 예산만 쥐고 있었다.
      # 이제 유휴일 때 1 만 쥐고 작업이 뜰 때 늘었다가 idle-timeout(기본 10분) 뒤에 도로 준다.
      # 대가는 작업 첫 문장이 커넥션을 새로 여는 시간인데, 사용자를 기다리게 하는 경로가 아니다.
      #
      # 예산 표는 docs/resource-budget.md 에 있다.
      maximum-pool-size: 4
      minimum-idle: 1

      data-source-properties:
        # 이 값이 무엇을 재는지는 application.yml 의 hikari 블록에 적어 두었다.
        #
        # 배치는 전역 기본값 10초로 못 산다. 정합성 검증이 member_coupon 300만 행과
        # 이력 420만 행을 통째로 훑도록 만든 배치라, 그 한 문장이 10초를 넘긴다.
        # 로컬에서 12초였고 CI 러너에서는 그보다 느려 실제로 끊겼다.
        #
        # 사용자를 기다리게 하는 경로가 아니라서 길게 잡아도 된다. 그래도 무한으로 두지는
        # 않는다. 매달린 문장 하나가 배치 커넥션을 영영 물고 있으면 다음 회차가 못 돈다.
        socketTimeout: 300000

management:
  endpoints:
    web:
      exposure:
        # 배치는 ALB 에 붙지 않아 readiness 를 볼 사람이 없다.
        # Prometheus 스크랩과 프로세스 생존 확인만 남긴다
        include: health, prometheus
