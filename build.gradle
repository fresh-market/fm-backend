plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    // integrationTest 를 IDE 가 테스트 소스로 보게 하려고 쓴다 (아래 idea 블록)
    id 'idea'
    id 'org.sonarqube' version '7.4.0.8496'
}

group = 'com.freshmarket'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

/*
 * 통합 테스트를 단위 테스트와 분리한다.
 * 커버리지는 단위 테스트의 .exec 만 센다 (BLD-1-04).
 */
sourceSets {
    integrationTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

/*
 * IDE 가 integrationTest 를 테스트 소스로 인식하게 한다.
 * Gradle 의 IDE 모델은 test 소스셋만 테스트로 표시하고 직접 만든 소스셋은 일반 소스로 넘긴다.
 * 그대로 두면 실행 아이콘이 뜨지 않고 프로덕션 코드로 취급되어 검사 규칙이 다르게 걸린다.
 */
idea {
    module {
        testSources.from(sourceSets.integrationTest.java.srcDirs)
        testResources.from(sourceSets.integrationTest.resources.srcDirs)
    }
}

configurations {
    compileOnly.extendsFrom annotationProcessor
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestCompileOnly.extendsFrom testCompileOnly
    integrationTestAnnotationProcessor.extendsFrom testAnnotationProcessor
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    /*
     * ALB 대상 그룹이 /actuator/health/readiness 를 찌르고 Prometheus 가 /actuator/prometheus 를 긁는다.
     * 둘 다 인프라 확정값이라 이 의존성이 없으면 인스턴스가 healthy 가 되지 않는다.
     */
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // 버전은 Boot 4.0.5 의 BOM 이 관리한다.
    implementation 'io.micrometer:micrometer-registry-prometheus'

    /*
     * 인증 방식은 아직 확정 항목이 아니다.
     * infra 의 기술스택 확정문서 8장이 "프로젝트 적용 시 채워야 할 항목" 으로 남겨 두었다.
     * 지금은 서버 세션을 두지 않는 구성으로 시작하고, 확정되면 SecurityConfig 를 그에 맞춘다.
     */
    implementation 'org.springframework.boot:spring-boot-starter-security'

    /*
     * 회원 로그인(카카오 OIDC). ClientRegistration/ClientRegistrationRepository는
     * spring-security-oauth2-client가, id_token 검증(NimbusJwtDecoder, JwtException 등)은
     * spring-security-oauth2-jose가 준다 — 이 스타터가 둘 다 전이 의존성으로 끌고 온다.
     * (branch 전환 중 스태시가 꼬이면서 한 번 빠졌던 적이 있어 다시 추가함 — 2026-08-18)
     */
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    /*
     * 로그인 state/nonce(KakaoLoginStateRepository), access token valid-after 커트라인,
     * refresh token rotation(CAS Lua 스크립트)이 전부 Redis에 있다.
     */
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    /*
     * 로컬(JVM) 캐시. 인스턴스 사이에 공유할 필요가 없고 값이 하루 동안 불변인 조회에 쓴다
     * (CampaignTargetLotCacheRepository). Redis 는 인스턴스 간 공유와 원자적 회전이 필요한
     * 인증 쪽 상태를 맡고, 이쪽은 네트워크 왕복 없이 읽는 것이 목적이라 저장소를 나눈다.
     * 버전은 Spring Boot BOM 이 관리한다.
     */
    implementation 'com.github.ben-manes.caffeine:caffeine'

    /*
     * JwtTokenProvider가 io.jsonwebtoken(JJWT) 0.12.x 플루언트 API(Jwts.builder()...signWith(),
     * Jwts.parser()...parseSignedClaims())를 쓴다. api는 컴파일 타임에, impl/jackson은 런타임에만
     * 필요하다(서명 클레임 직렬화에 Jackson을 쓴다).
     * (branch 전환 중 스태시가 꼬이면서 build.gradle에서 통째로 빠졌던 걸 다시 추가함 — 2026-08-18)
     */
    implementation 'io.jsonwebtoken:jjwt-api:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.7'

    /*
     * Boot 4 는 자동설정을 기술별 모듈로 쪼갰다.
     * flyway-core 만 있으면 FlywayAutoConfiguration 이 붙지 않아 마이그레이션이 조용히 건너뛴다.
     */
    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'

    /*
     * BOM 밖이라 버전을 직접 고정한다.
     * 3.0.3 이 Boot 4.0.5 를 parent 로 빌드된 것이다.
     */
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

    /*
     * 외부 API 호출 로깅(ExternalApiLoggingExchangeFilter, TraceIdExchangeFilter)이
     * WebClient의 ExchangeFilterFunction을 구현한다. MVC 서버라도 이 타입을 쓰려면
     * 리액티브 웹 모듈이 클래스패스에 있어야 한다.
     */
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    /*
     * 상품 이미지 업로드(#21). S3Presigner로 업로드 URL을 발급하고, HeadObject로 실제 업로드를
     * 확인한다(백엔드공통_이미지저장소_설계.md 6.2절). presigned POST 생성 기능은 Java SDK v2에
     * 없어 PUT만 쓴다 — 그래서 s3 모듈 하나로 충분하다(별도 presigner 아티팩트가 없다).
     *
     * s3 모듈은 동기 HTTP 클라이언트를 직접 들여오지 않는다(전이 의존은 비동기용 netty-nio-client
     * 뿐이다) — S3Client(동기)에 연결 타임아웃을 명시하려면(REL-2-01) apache5-client가 필요하다.
     */
    implementation platform('software.amazon.awssdk:bom:2.46.7')
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:apache5-client'

    /*
     * @Scheduled 메서드 공통 로깅(SchedulerLoggingAspect)이 커스텀 애노테이션
     * 포인트컷(@annotation(...))을 쓴다. spring-aop 자체는 spring-data-jpa가
     * (→ @Transactional 프록시) 전이 의존성으로 이미 들여오지만, AspectJ 애노테이션
     * 스타일 포인트컷을 실제로 짜려면 aspectjweaver가 클래스패스에 있어야 한다 —
     * 없으면 @Aspect 빈이 등록만 되고 조용히 아무 효과도 내지 않는다.
     */
    implementation 'org.aspectj:aspectjweaver:1.9.22'

    // logback-spring.xml의 prod 프로필이 JSON 라인으로 로그를 남긴다(로그 수집기가 파싱하기 쉽도록).
    implementation 'net.logstash.logback:logstash-logback-encoder:8.0'

    /*
     * QueryDSL 버전은 Boot 4.0.5 의 BOM 이 5.1.0 으로 관리한다.
     * jakarta 분류자를 빼면 javax.persistence 변형이 걸려 Boot 4 에서 깨진다.
     */
    implementation 'com.querydsl:querydsl-jpa::jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt::jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    runtimeOnly 'com.mysql:mysql-connector-j'

    /*
     * bootRun 이 compose.yaml 의 MySQL 을 자동으로 띄우고 접속 정보를 주입한다.
     * developmentOnly 라 bootJar 에는 들어가지 않는다.
     */
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    /*
     * 통합 테스트는 인메모리 DB 를 쓰지 않는다.
     * 운영과 같은 mysql:8.4 를 Testcontainers 로 띄운다 (tech-stack.md 2장).
     */
    /*
     * Boot 4 는 @DataJpaTest 와 @AutoConfigureTestDatabase 를 각각
     * spring-boot-data-jpa-test, spring-boot-jdbc-test 로 쪼갰다.
     * 이 스타터가 둘을 함께 끌어온다.
     
     * 추가
     * Boot 4 는 MockMvc 지원(@AutoConfigureMockMvc)을 spring-boot-starter-test 에서 분리해
     * spring-boot-starter-webmvc-test 로 뺐다. API 계층까지 검증하는 통합 테스트에 필요하다.
     */
    integrationTestImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    integrationTestImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    integrationTestImplementation 'org.springframework.security:spring-security-test'
    integrationTestImplementation 'org.springframework.boot:spring-boot-testcontainers'
    /*
     * Boot 4.0.5 의 BOM 이 Testcontainers 2.0.4 를 관리한다.
     * 2.x 에서 산출물 이름에 testcontainers- 접두사가 붙었다. 1.x 좌표(junit-jupiter, mysql)는 해석되지 않는다.
     */
    integrationTestImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    integrationTestImplementation 'org.testcontainers:testcontainers-mysql'

    /* 검증용 엔티티가 이 소스셋에 있으므로 APT 를 여기에도 건다.
       걸지 않으면 Q클래스가 생성되지 않아 컴파일이 깨진다. */
    integrationTestCompileOnly 'org.projectlombok:lombok'
    integrationTestAnnotationProcessor 'org.projectlombok:lombok'
    integrationTestAnnotationProcessor 'com.querydsl:querydsl-apt::jakarta'
    integrationTestAnnotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    integrationTestAnnotationProcessor 'jakarta.persistence:jakarta.persistence-api'

}

/*
 * bootJar 만 만든다.
 * 의존성이 빠진 plain jar 가 함께 있으면 Dockerfile 의 COPY *.jar 가 무엇을 담을지 글롭 순서에 좌우된다.
 * 잘못 담기면 기동 시점에야 드러난다.
 */
tasks.named('jar') {
    enabled = false
}

/*
 * bootJar 만 만든다.
 * 의존성이 빠진 plain jar 가 함께 있으면 Dockerfile 의 COPY *.jar 가 무엇을 담을지 글롭 순서에 좌우된다.
 * 잘못 담기면 기동 시점에야 드러난다.
 */
/*
 * 로컬 비밀값이 배포 산출물에 실리지 않게 막는다.
 * application-local.yml 은 카카오 키와 JWT 서명 키를 담고 src/main/resources 아래에 있어서,
 * 두면 jar 에 그대로 들어가고 컨테이너 이미지까지 따라간다.
 * .gitignore 는 커밋만 막지 빌드는 못 막는다.
 *
 * processResources 가 아니라 bootJar 에서 뺀다.
 * 이 파일은 클래스패스에 있어야 bootRun 이 읽으므로 build/resources/main 에는 남겨야 한다.
 */
tasks.named('bootJar') {
    exclude '**/application-local.yml'
}

tasks.named('jar') {
    enabled = false
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('integrationTest', Test) {
    description = '통합 테스트를 실행한다.'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter tasks.named('test')

    /*
     * application-integrationTest.yml 을 켠다.
     * IDE 에서 테스트 클래스를 직접 실행하면 이 설정이 안 걸리므로 클래스에도 @ActiveProfiles 를 붙여 둔다.
     */
    systemProperty 'spring.profiles.active', 'integrationTest'
}

jacoco {
    /*
     * tech-stack.md 는 0.8.16 이라 적었으나 그 버전은 배포된 적이 없다.
     * 최신이 0.8.15 다.
     */
    toolVersion = '0.8.15'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    /*
     * 게이트와 같은 실행 데이터를 읽는다.
     * 다르면 Sonar 수치와 차단 기준이 어긋나 어느 쪽이 진짜인지 헷갈린다.
     */
    executionData.setFrom fileTree(layout.buildDirectory.dir('jacoco')).include('test.exec')
    reports {
        // SonarQube 가 읽는 형식이다
        xml.required = true
    }
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('test')
    /*
     * 단위 테스트의 .exec 만 읽는다 (BLD-1-04).
     * 통합 테스트를 합산하면 서비스 로직을 단위 테스트 없이 통과시킬 수 있다.
     * 통합 테스트는 계층을 가로질러 실행되므로 메서드를 지나가기만 해도 커버리지가 채워진다.
     */
    executionData.setFrom fileTree(layout.buildDirectory.dir('jacoco')).include('test.exec')
    violationRules {
        rule {
            /*
             * includes 로 좁히므로 exclude 목록이 필요 없다.
             * config, dto, entity, Q클래스가 자동으로 빠진다 (BLD-1-01).
             * 패키지 전체를 대상으로 삼는다. 그 안에 ~Service 만 두도록 ArchitectureTest 가
             * 막으므로(DPB-4-10) 대상에서 빠지는 클래스가 생기지 않는다.
             */
            element = 'CLASS'
            includes = ['*.domain.service.*']
            limit {
                counter = 'METHOD'
                value = 'COVEREDRATIO'
                minimum = 1.00
            }
        }
    }
}

/*
 * jacocoTestCoverageVerification 은 .exec 가 하나도 없으면 Gradle 이 통째로 건너뛴다.
 * 검증 대상 클래스가 있는데 건너뛴 것이 초록으로 보이면 게이트가 없는 것과 같다.
 * 테스트를 하나도 안 쓰면 무사통과하고 하나라도 쓰면 100% 를 요구하는, 거꾸로 걸린 게이트가 된다.
 * 그래서 대상 클래스의 존재와 실행 데이터의 존재를 따로 확인한다 (BLD-1-07).
 */
tasks.register('coverageDataCheck') {
    description = '커버리지 검증 대상이 있는데 실행 데이터가 없는 상태를 막는다'
    group = 'verification'
    dependsOn tasks.named('test')

    def targets = fileTree(layout.buildDirectory.dir('classes/java/main')) {
        include '**/domain/service/*.class'
    }
    // 게이트가 읽는 것과 같은 파일을 본다
    def execFiles = fileTree(layout.buildDirectory.dir('jacoco')) {
        include 'test.exec'
    }

    inputs.files(targets, execFiles)
    doLast {
        if (targets.isEmpty()) {
            logger.lifecycle('커버리지 검증 대상 없음. *.domain.service.* 클래스가 아직 없다')
            return
        }
        if (execFiles.filter { it.exists() }.isEmpty()) {
            throw new GradleException(
                    "커버리지 검증 대상이 ${targets.files.size()}개 있는데 실행 데이터가 없다.\n" +
                    '테스트가 하나도 없으면 jacocoTestCoverageVerification 이 건너뛰어 통과처럼 보인다.\n' +
                    '대상: ' + targets.files.collect { it.name }.sort().join(', '))
        }
    }
}

// BLD-1-05
tasks.named('check') {
    dependsOn tasks.named('integrationTest'),
            tasks.named('jacocoTestCoverageVerification'),
            tasks.named('coverageDataCheck')
}

// BLD-1-06: 순서가 바뀌면 SonarQube 에 커버리지가 0 으로 표시된다
tasks.named('sonar') {
    dependsOn tasks.named('jacocoTestReport')
}

sonar {
    properties {
        property 'sonar.projectKey', 'fresh-market_fm-backend'
        property 'sonar.organization', 'fresh-market'
        property 'sonar.host.url', 'https://sonarcloud.io'
        /*
         * 커버리지 판정은 Gradle 이 한다. Sonar 는 버그와 취약점만 본다 (BLD-2-01).
         * 이 경로는 판정용이 아니라 대시보드 표시용이다.
         */
        property 'sonar.coverage.jacoco.xmlReportPaths',
                layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml').get().asFile.path

        /*
         * sonar.qualitygate.wait 을 켜지 않는다.
         * 켜면 내장 게이트 Sonar way 로 판정하는데, 거기에 "신규 코드 커버리지 80% 이상" 이
         * 들어 있어 Gradle 의 서비스 레이어 100% 기준과 판정 주체가 둘이 된다 (BLD-2-01).
         * 커스텀 게이트로 그 조건을 빼려면 Team 플랜이 필요하다. 무료 플랜은 내장 게이트뿐이다.
         * 그래서 신규 Blocker 0건은 pr-gate.yml 이 이슈 검색 API 로 직접 확인한다 (BLD-2-02).
         */
    }
}
