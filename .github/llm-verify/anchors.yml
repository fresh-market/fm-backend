# 앵커 규칙 (backend)
#
# diff 에 어떤 파일이 있으면 (1) 어떤 파일을 함께 동봉하고 (2) 어떤 점검 항목을 켤지 정한다.
# 판정 항목의 정의는 items.yml, 설계 근거는 fresh-market/.github 의 qa-llm-verification.md 3장에 있다.
#
# 참조하는 레지스트리는 셋이다.
#   backend/.github/llm-verify/items.yml   260건  코드 관용과 패턴, 빌드 게이트
#   fresh-market/.github ... items.yml            217건  일반 품질 속성
#   fresh-market/fm-infra   ... items.yml             96건  인프라 결정이 코드에 부과하는 제약 (INF 접두사)
# INF 항목은 판정 대상이 이 저장소의 코드이므로 여기서 활성화한다.
#
# trigger 패턴은 domain-package-boundary-guideline.md 1절이 확정한 패키지 구조를 따른다.
# 구조가 바뀌면 이 파일도 함께 고친다.

version: 1
source: backend

defaults:
  # 판정 대상으로 치는 것. 이 중 하나도 안 바뀌면 판정하지 않는다.
  #
  # 문서만 고친 커밋이 on_no_match 로 떨어지면 EJ 항목 50건이 켜지는데,
  # 자바가 하나도 안 바뀌었으니 전부 NOT_APPLICABLE 이 나올 수밖에 없다.
  # 최근 30커밋 중 17건이 그런 커밋이라 실행의 절반 이상이 답이 정해진 질문을 했다.
  # 문서 변경의 정합성은 registry-check.yml 이 따로 본다.
  code_globs:
    - "**/*.java"
    - "src/main/resources/**"
    - "build.gradle"
    - "settings.gradle"
    - "gradle/**"
  # 어떤 규칙도 걸리지 않으면 최소 집합만 켠다
  on_no_match:
    activate:
      levels: [코드]
      prefixes: [EJ]
  # 앵커를 가져오지 못하면 통과시키지 않는다
  unresolved_anchor: INSUFFICIENT_EVIDENCE
  # 기준 저장소 참조는 시점으로 고정한다 (qa-llm-verification.md 2.2절)
  baseline_ref: base

rules:
  - id: controller
    status: unverified
    trigger:
      - "**/domain/controller/*.java"
      # DTO 는 컨트롤러의 계약이라 같은 항목으로 판정한다.
      # DTO 만 바뀌는 PR 이 어떤 규칙에도 안 걸리면 DPB-4-06 의 이름 규칙이 발화하지 않는다
      - "**/domain/dto/*.java"
    anchors:
      - "**/config/SecurityConfig.java"
      - "**/domain/service/*.java"
      - "**/domain/dto/*.java"
      - "**/*Api.java"
    activate:
      prefixes: [SEC, CMP, API, DPB, EJ, FUN, IDS, INF]
      levels: [코드, 설계]
      # 이미지 URL 을 응답에 넣는 곳이 컨트롤러와 DTO 다
      chapters: { INF: [11] }

  - id: service
    status: unverified
    trigger:
      - "**/domain/service/*.java"
    anchors:
      - "**/domain/repository/*.java"
      - "**/domain/entity/*.java"
      - "**/domain/client/**/*.java"
      - "**/*Api.java"
      # 권한 모델을 확인해야 소유권 검증 누락을 판정할 수 있다
      - "**/config/SecurityConfig.java"
    activate:
      prefixes: [DI, PERF, REL, DPB, EJ, FUN, MNT, FLX, TRD, INF, SEC]
      levels: [코드, 설계]
      chapters:
        INF: [1, 2, 8, 11]                # 배치와 분산 락, 스케일 인, 정합성 감지, 이미지 저장소
        # 소유권 검증과 주입, 민감 정보 노출, 남용 방지는 서비스 로직이 판정 대상이다.
        # 3장(입력 검증)은 controller 가, 5장(감사 이력)은 entity 와 migration 이 맡는다.
        SEC: [1, 2, 4, 6]

  - id: entity
    status: unverified
    trigger:
      - "**/domain/entity/*.java"
    anchors:
      - "**/domain/repository/*.java"
      - "src/main/resources/db/migration/*.sql"
      - "**/common/entity/*.java"
    activate:
      # DPB: 도메인 루트에 @Entity 가 올라오지 않는가, 엔티티에 Admin 접두사를 붙이지 않았는가
      prefixes: [BE, EC, JPA, DI, CMP, IDS, INF, DPB, EJ]
      levels: [코드, 설계]
      chapters: { INF: [8] }              # 누적 값 이력 테이블

  - id: repository
    status: unverified
    trigger:
      - "**/domain/repository/*.java"
    anchors:
      - "**/domain/entity/*.java"
      - "src/main/resources/db/migration/*.sql"
    activate:
      # DPB: 레포지토리가 도메인 루트에 올라오지 않는가, Admin 접두사를 붙이지 않았는가
      prefixes: [PERF, DI, JPA, SEC, DPB, EJ]
      levels: [코드, 설계]
      chapters:
        # 쿼리 조립과 소유자 조건은 여기가 판정 대상이다.
        # @Query 문자열 연결과 Pageable 정렬 컬럼이 주입 경로가 된다.
        SEC: [1, 2]

  - id: external-client
    status: unverified
    trigger:
      - "**/domain/client/**/*.java"
    anchors:
      - "**/domain/service/*.java"
      - "src/main/resources/application*.yml"
    activate:
      prefixes: [REL, DPB, OBS, INF, EJ]
      levels: [코드, 설계, 인프라]
    # 타임아웃 계층과 서킷 설정을 확정값과 대조한다
      chapters: { INF: [3] }              # 외부 호출 타임아웃

  - id: api-contract
    status: unverified
    trigger:
      - "**/*Api.java"
      - "**/*ApiImpl.java"
    anchors:
      - "**/domain/service/*.java"
      - "**/domain/controller/*.java"
    activate:
      prefixes: [DPB, CMP, API, IDS, INF, EJ]
      levels: [코드, 설계]
      chapters: { INF: [6] }              # 혼재 구간의 응답 필드 규칙

  - id: migration
    status: unverified
    trigger:
      - "src/main/resources/db/migration/*.sql"
    anchors:
      # 이력 전체를 본다. 이전 마이그레이션과의 순서가 판정에 필요하다
      - "src/main/resources/db/migration/*.sql"
      - "**/domain/entity/*.java"
    activate:
      prefixes: [DI, CMP, FLX, BE, IDS, INF]
      # backend 항목은 층위 태깅 전이라 전부 코드다. 코드를 빼면 BE 와 IDS 가 전부 걸러진다
      levels: [코드, 설계, 인프라]
      chapters: { INF: [6] }              # 확장 후 축소

  - id: app-config
    status: unverified
    trigger:
      - "src/main/resources/application*.yml"
      - "src/main/resources/logback*.xml"
    anchors:
      # 전 프로파일을 함께 본다. 한 프로파일만 보면 값의 차이를 알 수 없다
      - "src/main/resources/application*.yml"
      - "src/main/resources/logback*.xml"
      - "build.gradle"
    activate:
      # SEC: 요청 본문 크기 상한 등 application.yml 로 거는 보안 설정
      prefixes: [REL, PERF, OBS, FLX, SEC, INF]
      # INF 는 층위 태깅 전이라 전부 코드다. 빼면 타임아웃/헬스체크 항목이 전부 걸러진다
      levels: [코드, 인프라, 설계]
    # 커넥션풀, 타임아웃, graceful shutdown 값을 확정값과 대조한다
      chapters: { INF: [3, 4, 5, 7, 9] }  # 타임아웃, 헬스체크, 컨테이너, SSM, 관측

  - id: test
    status: unverified
    trigger:
      - "src/test/**/*Test.java"
      # 통합 테스트는 별도 소스셋이라 src/test 글롭에 걸리지 않는다 (build.gradle 의 integrationTest)
      - "src/integrationTest/**/*.java"
    anchors:
      # 대상 프로덕션 클래스를 함께 본다
      - "**/domain/service/*.java"
      - "**/domain/entity/*.java"
    activate:
      # DPB 와 EJ 는 넣지 않는다. 프로덕션 코드를 겨냥한 항목이라
      # 테스트에 걸면 목 주입, 픽스처 빌더, 긴 메서드명이 전부 지적으로 나온다
      prefixes: [UT, MNT]
      levels: [코드]

  - id: archunit
    status: unverified
    trigger:
      - "src/test/**/ArchitectureTest.java"
    anchors: []
    activate:
      # 테스트 파일이지만 판정 대상이 경계 규칙 자체라 DPB 를 켠다. EJ 는 뺀다
      prefixes: [DPB]
      levels: [코드, 설계]

  - id: build
    status: unverified
    trigger:
      - "build.gradle"
      - "settings.gradle"
    anchors: []
    activate:
      # BLD: JaCoCo 커버리지와 SonarQube 게이트 설정. 판정 대상이 build.gradle 이라 이 저장소가 소유한다
      prefixes: [BLD, MNT, PERF]
      levels: [코드, 인프라, 프로세스]

# EJ 와 DPB 는 프로덕션 자바를 트리거로 하는 모든 규칙에 들어간다
#   CODEREVIEW.md 가 이 둘을 "변경 위치와 무관하게 모든 프로덕션 자바 PR 에 항상 적용" 으로 규정한다.
#   규칙을 새로 만들 때 트리거가 src/main 의 *.java 면 두 접두사를 반드시 넣는다.
#
#   제외 대상은 둘이다.
#     test        프로덕션 코드를 겨냥한 항목이라 테스트에 걸면 오탐만 는다
#     migration(.sql), app-config(yml), build(gradle)   자바가 아니다
#
#   archunit 은 src/test 아래지만 판정 대상이 경계 규칙 자체이므로 DPB 를 켠다.
#
# activate.chapters 의 의미
#   접두사만 쓰면 그 문서의 전 항목이 켜진다. INF 49건처럼 장마다 대상이 다른 문서는
#   장 번호로 범위를 좁힌다. 지정하지 않은 접두사는 전 장을 켠다.
#
# status 의 의미
#   unverified : 실제 파일에 매칭된 적이 없다. 패턴이 틀렸을 수 있다
#   verified   : 한 번 이상 매칭되어 패턴이 유효함이 확인되었다
#
# 첫 매칭에 성공하면 verified 로 올린다.
# 3개월간 한 번도 매칭되지 않은 규칙은 분기 점검에서 패턴 오류 여부를 확인한다.
# 관측 가능성 문서의 "한 번도 발화하지 않은 알림은 조건이 잘못됐는지 확인한다"와 같은 논리다.

# 이 파일이 다루지 않는 것
#
# 인프라 계층 점검 항목(레이트 리밋, 분산 락 만료, 트래픽 단계 유입, 복제본 승격 등)은
# 이 저장소의 파일 변경으로 트리거되지 않는다. Terraform 과 k8s manifest 가 대상이므로
# fresh-market/fm-infra 의 anchors.yml 이 담당한다.
#
# 프로세스 계층 항목(43건)은 G-PR 이 아니라 G-AUDIT 이 주기별로 판정한다.
# 앵커 규칙의 대상이 아닌 것이 정상이다.
