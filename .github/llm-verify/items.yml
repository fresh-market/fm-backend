  - {id: UT-6-02, doc: unit-testing-guideline.md, ch: 6, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "테스트 간에 상태를 공유해 서로 영향을 주지 않는가", criteria: "공유 상태는 실행 순서에 따라 결과가 달라지는 깨지기 쉬운 테스트를 만든다."}
  - {id: UT-6-03, doc: unit-testing-guideline.md, ch: 6, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "커버리지 숫자 자체를 목표로 삼지 않는가", criteria: "높은 커버리지가 곧 좋은 테스트는 아니다. 검증 없이 실행만 하는 테스트도 커버리지는 올린다."}
