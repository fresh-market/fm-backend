items:
  - {id: API-2-01, doc: api-design-guideline.md, ch: 2, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "API를 리소스 계층(컬렉션과 하위 컬렉션)으로 모델링했는가 (AIP-121)"}
  - {id: API-2-02, doc: api-design-guideline.md, ch: 2, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "API 표면을 내부 DB 스키마와 동일하게 노출하지 않았는가 (AIP-121)", criteria: "DB 구조를 그대로 드러내면 표면이 내부 구현에 강하게 묶인다."}
  - {id: API-2-03, doc: api-design-guideline.md, ch: 2, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "리소스 이름이 계층을 드러내는 경로 형식인가 (AIP-122)", criteria: "예: `publishers/{publisher}/books/{book}`. 컬렉션 ID는 복수형을 쓴다."}
  - {id: API-2-04, doc: api-design-guideline.md, ch: 2, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "리소스 간 참조와 부모 자식 관계가 순환 없이 단방향(비순환 그래프)인가 (AIP-121, AIP-124)"}
  - {id: API-2-05, doc: api-design-guideline.md, ch: 2, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "enum을 적절히 정의하고 0번 값을 unspecified로 두었는가 (AIP-126)"}
  - {id: API-2-06, doc: api-design-guideline.md, ch: 2, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "서버가 채우는 값과 기본값을 명확히 구분했는가 (AIP-129)"}
  - {id: API-2-07, doc: api-design-guideline.md, ch: 2, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "단일 인스턴스 리소스는 싱글톤으로 설계했는가 (AIP-156)"}
  - {id: API-2-08, doc: api-design-guideline.md, ch: 2, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "관리자용 경로가 `/v1/admin/` 아래에 모여 있는가", criteria: "같은 리소스라도 소비자가 다르면 표면이 갈린다. 관리자 경로가 회원 경로에 섞이면 인증 방식과 노출 필드가 경로만으로 구분되지 않는다. 클래스 이름은 이 경로를 그대로 따른다(`domain-package-boundary-guideline.md` 4.2절)."}
  - {id: API-3-01, doc: api-design-guideline.md, ch: 3, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "표준 메서드(Get, List, Create, Update, Delete)로 표현 가능한 동작을 커스텀으로 만들지 않았는가 (AIP-130)"}
  - {id: API-3-02, doc: api-design-guideline.md, ch: 3, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "리소스가 최소한 Get을 지원하는가, 그리고 싱글톤이 아니면 List도 지원하는가 (AIP-121)"}
  - {id: API-3-03, doc: api-design-guideline.md, ch: 3, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "Get은 부수 효과가 없는가 (AIP-131)"}
  - {id: API-3-04, doc: api-design-guideline.md, ch: 3, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "List는 페이지네이션을 제공하는가 (AIP-132, AIP-158)"}
  - {id: API-3-05, doc: api-design-guideline.md, ch: 3, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "Create는 부모 컬렉션에 대해 수행하고 생성된 리소스를 반환하는가 (AIP-133)"}
  - {id: API-3-06, doc: api-design-guideline.md, ch: 3, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "Update는 필드 마스크로 부분 수정을 지원하는가 (AIP-134, AIP-161)"}
  - {id: API-3-07, doc: api-design-guideline.md, ch: 3, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "Delete의 응답과 멱등성, 그리고 소프트 삭제 여부를 검토했는가 (AIP-135, AIP-164)"}
  - {id: API-3-08, doc: api-design-guideline.md, ch: 3, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "커스텀 메서드는 표준 HTTP 동사(주로 POST)에 콜론 표기로 동사를 붙였는가 (AIP-136)", criteria: "예: `POST /v1/publishers/123/books/456:publish`"}
  - {id: API-3-09, doc: api-design-guideline.md, ch: 3, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "오래 걸리는 작업은 장기 실행 오퍼레이션으로 처리하고 폴링 가능한 핸들을 반환하는가 (AIP-151)"}
  - {id: API-3-10, doc: api-design-guideline.md, ch: 3, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "여러 건을 한 번에 처리하는 배치 메서드는 전부 성공 또는 전부 실패(원자성)를 따르는가 (AIP-231~235)"}
  - {id: API-4-01, doc: api-design-guideline.md, ch: 4, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "필드 이름이 같은 개념에 같은 이름을 쓰는가 (AIP-140)"}
  - {id: API-4-02, doc: api-design-guideline.md, ch: 4, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "전치사를 넣지 않았는가 (AIP-140)", criteria: "예: `error_reason`(권장), `reason_for_error`(지양)"}
  - {id: API-4-03, doc: api-design-guideline.md, ch: 4, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "필드 이름이 동사가 아니라 명사인가 (AIP-140)", criteria: "필드는 의도가 아니라 값을 나타낸다. `disabled`(권장), `disable`(지양)"}
  - {id: API-4-04, doc: api-design-guideline.md, ch: 4, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "반복 필드는 복수형, 단일 필드는 단수형인가 (AIP-140, AIP-144)"}
  - {id: API-4-05, doc: api-design-guideline.md, ch: 4, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "boolean 필드에 'is' 접두어를 붙이지 않았는가 (AIP-140)", criteria: "예: `disabled`(권장), `is_disabled`(지양)"}
  - {id: API-4-06, doc: api-design-guideline.md, ch: 4, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "수량 필드는 단위 접미어를 붙였는가 (AIP-141)", criteria: "예: `distance_km`, `width_px`. 비율에는 'per'를 쓴다."}
  - {id: API-4-07, doc: api-design-guideline.md, ch: 4, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "시간과 기간을 표준 타입으로 표현하고 이름을 `*_time`, `*_duration`으로 두었는가 (AIP-142)"}
  - {id: API-4-08, doc: api-design-guideline.md, ch: 4, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "언어, 통화, 국가 등은 표준 코드(BCP-47, ISO 4217, ISO 3166)를 쓰는가 (AIP-143)"}
  - {id: API-4-09, doc: api-design-guideline.md, ch: 4, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "범위 필드의 포함과 배제 경계를 명확히 했는가 (AIP-145)"}
  - {id: API-4-10, doc: api-design-guideline.md, ch: 4, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "임의 구조 데이터(Struct, Any 등)는 꼭 필요할 때만 제한적으로 쓰는가 (AIP-146)"}
  - {id: API-4-11, doc: api-design-guideline.md, ch: 4, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "민감 정보는 입력 전용으로 두고 응답에 반환하지 않는가 (AIP-147)"}
  - {id: API-4-12, doc: api-design-guideline.md, ch: 4, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "표준 필드(name, create_time, update_time, uid, display_name 등)는 정해진 의미와 타입으로 쓰는가 (AIP-148)"}
  - {id: API-4-13, doc: api-design-guideline.md, ch: 4, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "값의 미설정과 기본값을 구분해야 하는 경우를 처리했는가 (AIP-149)"}
  - {id: API-4-14, doc: api-design-guideline.md, ch: 4, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "필드 동작(REQUIRED, OPTIONAL, OUTPUT_ONLY, IMMUTABLE, INPUT_ONLY)을 문서화했는가 (AIP-202, AIP-203)"}
  - {id: API-4-15, doc: api-design-guideline.md, ch: 4, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "상태 필드는 `state`로 두고 출력 전용이며 전이 규칙을 문서화했는가, 상태에 동작을 섞지 않았는가 (AIP-216)"}
  - {id: API-5-01, doc: api-design-guideline.md, ch: 5, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "컬렉션 반환은 처음부터 페이지네이션을 넣었는가 (AIP-158)", criteria: "나중에 추가하면 호환성이 깨진다. `page_size`, `page_token` 요청 필드와 `next_page_token` 응답 필드를 쓴다."}
  - {id: API-5-02, doc: api-design-guideline.md, ch: 5, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "page_token은 클라이언트가 해석할 수 없는 불투명 문자열인가 (AIP-158)"}
  - {id: API-5-03, doc: api-design-guideline.md, ch: 5, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "컬렉션 횡단 조회는 부모에 와일드카드(`-`)를 쓰는가 (AIP-159)"}
  - {id: API-5-04, doc: api-design-guideline.md, ch: 5, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "필터링은 `filter` 문자열 필드로 표준 문법을 따르는가 (AIP-160)"}
  - {id: API-5-05, doc: api-design-guideline.md, ch: 5, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "부분 수정과 부분 응답에 필드 마스크를 쓰는가 (AIP-161, AIP-157)"}
  - {id: API-5-06, doc: api-design-guideline.md, ch: 5, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "갱신 손실을 막기 위해 etag로 리소스 신선도를 검증하는가 (AIP-154)"}
  - {id: API-5-07, doc: api-design-guideline.md, ch: 5, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "재시도 시 중복 처리를 막기 위해 요청 식별자(request_id)로 멱등성을 보장하는가 (AIP-155)"}
  - {id: API-5-08, doc: api-design-guideline.md, ch: 5, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "실제 반영 없이 검증만 하는 validate_only(드라이런)를 제공하는가 (AIP-163)"}
  - {id: API-5-09, doc: api-design-guideline.md, ch: 5, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "삭제는 소프트 삭제로 처리하고 undelete, 만료, show_deleted 목록 옵션을 검토했는가 (AIP-164)"}
  - {id: API-5-10, doc: api-design-guideline.md, ch: 5, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "조건 기반 일괄 삭제는 위험을 고려해 신중히 설계했는가 (AIP-165)"}
  - {id: API-5-11, doc: api-design-guideline.md, ch: 5, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "가져오기와 내보내기는 커스텀 메서드(:import, :export)로 표현했는가 (AIP-153)"}
  - {id: API-5-12, doc: api-design-guideline.md, ch: 5, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "반복 실행 단위는 잡(Job) 패턴으로 분리했는가 (AIP-152)"}
  - {id: API-5-13, doc: api-design-guideline.md, ch: 5, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "리소스 만료가 필요하면 expire_time이나 ttl을 제공하는가 (AIP-214)"}
  - {id: API-5-14, doc: api-design-guideline.md, ch: 5, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "일부 위치를 조회하지 못할 수 있으면 List 응답에 unreachable을 두는가 (AIP-217)"}
  - {id: API-5-15, doc: api-design-guideline.md, ch: 5, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "인가를 먼저 검사하고, 그다음 존재 여부를 확인하는가 (AIP-211, AIP-193)"}
  - {id: API-5-16, doc: api-design-guideline.md, ch: 5, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "텍스트는 UTF-8로 다루는가 (AIP-210)"}
  - {id: API-6-01, doc: api-design-guideline.md, ch: 6, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "이번 변경이 하위 호환을 깨는 변경인지 확인했는가 (AIP-180)", criteria: "필수 필드 추가, 필드 제거나 이름 변경, 타입 변경, 기존 메서드에 페이지네이션 추가, 검증 강화 등이 호환을 깬다."}
  - {id: API-6-02, doc: api-design-guideline.md, ch: 6, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "안정성 단계(alpha, beta, stable)를 명확히 했는가 (AIP-181)"}
  - {id: API-6-03, doc: api-design-guideline.md, ch: 6, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "호환을 깨는 변경은 새 메이저 버전으로 분리했는가 (AIP-185)", criteria: "버전은 경로에 둔다. 예: `/v1/...`, `/v2/...`"}
  - {id: API-6-04, doc: api-design-guideline.md, ch: 6, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "API 계약이 외부 소프트웨어에 불필요하게 의존하지 않는가 (AIP-182)"}
  - {id: API-7-01, doc: api-design-guideline.md, ch: 7, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "명명 규칙을 API 전체에서 일관되게 따랐는가 (AIP-190)"}
  - {id: API-7-02, doc: api-design-guideline.md, ch: 7, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "모든 메서드, 리소스, 필드에 문서 주석을 달았는가 (AIP-192)"}
  - {id: API-7-03, doc: api-design-guideline.md, ch: 7, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "오류 응답이 표준 구조와 표준 코드를 따르는가 (AIP-193)", criteria: "표준 상태 코드를 쓰고, 기계 판독용 식별자(reason, domain)와 동적 정보(metadata)를 포함한다."}
  - {id: API-7-04, doc: api-design-guideline.md, ch: 7, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "오류 메시지가 간결하면서 해결 방향을 제시하고, 내부 구현이나 민감 정보를 노출하지 않는가 (AIP-193)"}
  - {id: API-7-05, doc: api-design-guideline.md, ch: 7, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "권한이 없으면 존재 여부와 무관하게 PERMISSION_DENIED(403)를, 권한은 있으나 없으면 NOT_FOUND(404)를 반환하는가 (AIP-193, AIP-211)"}
  - {id: API-7-06, doc: api-design-guideline.md, ch: 7, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "어떤 오류 코드가 재시도 가능한지 정의했는가 (AIP-194)", criteria: "예: 일시적 가용성 오류는 재시도 가능, 잘못된 인자는 재시도 불가."}
  - {id: API-8-01, doc: api-design-guideline.md, ch: 8, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "HTTP와 gRPC 매핑을 google.api.http 애너테이션으로 정의했는가 (AIP-127)"}
  - {id: API-8-02, doc: api-design-guideline.md, ch: 8, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "공통 타입(google.rpc, google.type 등)을 재사용했는가 (AIP-213)"}
  - {id: API-8-03, doc: api-design-guideline.md, ch: 8, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "API용 proto를 내부 저장용 proto와 분리했는가 (AIP-215)"}
  - {id: API-8-04, doc: api-design-guideline.md, ch: 8, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "proto 파일과 디렉터리 구조가 규칙을 따르는가 (AIP-191)"}
  - {id: BE-1-01, doc: base-entity-guideline.md, ch: 1, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database], level_verified: false, title: "모든 `@Entity`가 위 네 클래스 중 하나를 상속하는가"}
  - {id: BE-1-02, doc: base-entity-guideline.md, ch: 1, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database], level_verified: false, title: "수정되지 않는 테이블(이력, 로그)에 `Mutable` 베이스를 쓰지 않았는가", criteria: "`updated_at`이 영원히 `created_at`과 같은 값으로 남아 컬럼과 인덱스가 낭비된다."}
  - {id: BE-1-03, doc: base-entity-guideline.md, ch: 1, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database], level_verified: false, title: "`public_id`를 엔티티가 직접 선언하지 않고 `BasePublic*` 상속으로 얻는가", criteria: "직접 선언하면 컬럼명과 타입이 갈려 공통 매핑이 무너진다. `IDS-6-01`이 요구하는 `BINARY(16) NOT NULL`을 엔티티마다 지켜야 한다."}
  - {id: BE-1-04, doc: base-entity-guideline.md, ch: 1, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database], level_verified: false, defers_to: [IDS-2-03], title: "외부에 노출되지 않는 엔티티가 `BasePublic*`을 상속하지 않았는가", criteria: "UNIQUE 인덱스 하나는 저장 공간과 삽입 비용을 모두 늘린다. 쓰이지 않으면 순손실이다."}
  - {id: BE-1-05, doc: base-entity-guideline.md, ch: 1, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database], level_verified: false, title: "`id`와 시각 컬럼을 엔티티가 직접 선언하지 않았는가"}
  - {id: BE-1-06, doc: base-entity-guideline.md, ch: 1, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database], level_verified: false, title: "베이스가 `UUID`를 들고 타입 래퍼를 만들지 않았는가", criteria: "`AttributeConverter`도 새로 만들지 않는다. Hibernate 기본 매핑이 `binary(16)`이다."}
  - {id: BE-1-07, doc: base-entity-guideline.md, ch: 1, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database], level_verified: false, title: "하위 엔티티의 생성자나 팩터리가 `public_id`를 인자로 받지 않는가", criteria: "ORM 이 채우므로 받을 이유가 없다. 받아도 INSERT 때 덮어쓰이므로 값이 조용히 사라진다. v4 예외 대상 테이블은 `style = RANDOM`으로 바꾸고 사유를 남긴다(`IDS-3-01`)."}
  - {id: BE-2-01, doc: base-entity-guideline.md, ch: 2, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database], level_verified: false, title: "PK가 `Long`(MySQL `BIGINT`)인가"}
  - {id: BE-2-02, doc: base-entity-guideline.md, ch: 2, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database], level_verified: false, title: "`@GeneratedValue(strategy = GenerationType.IDENTITY)`를 쓰는가"}
  - {id: BE-2-03, doc: base-entity-guideline.md, ch: 2, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database], level_verified: false, title: "코드 테이블도 정수 PK를 쓰는가"}
  - {id: BE-2-04, doc: base-entity-guideline.md, ch: 2, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database], level_verified: false, title: "문자열 PK를 쓴다면 5절의 예외 조건과 사유가 PR에 있는가"}
  - {id: BE-3-01, doc: base-entity-guideline.md, ch: 3, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database], level_verified: false, title: "생성 시각을 `LocalDateTime.now()`로 직접 대입하지 않는가"}
  - {id: BE-3-02, doc: base-entity-guideline.md, ch: 3, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database], level_verified: false, title: "`created_at`에 `updatable = false`가 지정되어 있는가"}
  - {id: BE-3-03, doc: base-entity-guideline.md, ch: 3, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database], level_verified: false, title: "설정 클래스에 `@EnableJpaAuditing`이 한 번 선언되어 있는가", criteria: "선언이 없으면 `@CreatedDate`가 조용히 동작하지 않아 시각이 `null`로 저장된다."}
  - {id: BE-3-04, doc: base-entity-guideline.md, ch: 3, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database], level_verified: false, title: "`@EntityListeners(AuditingEntityListener.class)`를 하위 클래스에 중복 선언하지 않았는가"}
  - {id: BE-4-01, doc: base-entity-guideline.md, ch: 4, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database], level_verified: false, title: "테이블로 만들 근거(운영자의 런타임 관리 요구)가 있는가", criteria: "근거가 없으면 enum이어야 한다."}
  - {id: BE-4-02, doc: base-entity-guideline.md, ch: 4, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database], level_verified: false, title: "코드 테이블이 `BaseMutableTimeEntity`를 상속하는가"}
  - {id: BE-4-03, doc: base-entity-guideline.md, ch: 4, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database], level_verified: false, title: "`code` 컬럼에 UNIQUE 제약이 있는가"}
  - {id: BE-4-04, doc: base-entity-guideline.md, ch: 4, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database], level_verified: false, title: "코드값 조회 경로(`findByCode`)와 캐싱이 준비되어 있는가"}
  - {id: BE-5-01, doc: base-entity-guideline.md, ch: 5, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database], level_verified: false, title: "세 조건이 모두 성립하는가", criteria: "사유 코드 같은 소형 코드 테이블은 2번이 맞지 않아 해당하지 않는다."}
  - {id: BE-5-02, doc: base-entity-guideline.md, ch: 5, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database], level_verified: false, title: "베이스 미상속 사유가 PR에 기재되어 있는가"}
  - {id: BE-5-03, doc: base-entity-guideline.md, ch: 5, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database], level_verified: false, title: "시각 컬럼을 직접 선언했는가", criteria: "베이스를 상속하지 않으므로 `created_at`과 `updated_at`이 자동으로 생기지 않는다."}
  - {id: BLD-1-01, doc: build-gate-guideline.md, ch: 1, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "JaCoCo 대상이 `*.internal.service.*`로 좁혀져 있는가", criteria: "`includes`로 좁히므로 exclude 목록이 필요 없다. config, dto, entity, Q클래스가 자동으로 빠진다. 패키지 전체가 대상이며, 그 안에 `~Service`만 두도록 `DPB-4-10`이 막으므로 대상에서 빠지는 클래스가 생기지 않는다."}
  - {id: BLD-1-02, doc: build-gate-guideline.md, ch: 1, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "판정 단위가 클래스별(`element = 'CLASS'`), 카운터가 메서드(`counter = 'METHOD'`)인가"}
  - {id: BLD-1-03, doc: build-gate-guideline.md, ch: 1, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "기준이 `minimum = 1.00`인가"}
  - {id: BLD-1-04, doc: build-gate-guideline.md, ch: 1, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "커버리지 판정이 단위 테스트의 `.exec`만 읽는가", criteria: "통합 테스트를 합산하면 계층을 가로질러 메서드를 지나가기만 해도 커버리지가 차서, 서비스 로직을 단위 테스트 없이 통과시킬 수 있다."}
  - {id: BLD-1-05, doc: build-gate-guideline.md, ch: 1, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "`check`가 `integrationTest`와 `jacocoTestCoverageVerification`에 의존하는가"}
  - {id: BLD-1-06, doc: build-gate-guideline.md, ch: 1, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "`jacocoTestReport`가 `sonar` 태스크보다 먼저 도는가", criteria: "순서가 바뀌면 SonarQube에 커버리지가 0으로 표시된다."}
  - {id: BLD-1-07, doc: build-gate-guideline.md, ch: 1, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "검증 대상 클래스가 있는데 실행 데이터가 없는 상태를 막는가", criteria: "`jacocoTestCoverageVerification`은 `.exec`가 하나도 없으면 Gradle이 태스크를 통째로 건너뛴다. 건너뛴 것은 초록으로 보이므로, 테스트를 하나도 안 쓰면 무사통과하고 하나라도 쓰면 100%를 요구하는 거꾸로 걸린 게이트가 된다. 대상 클래스의 존재와 실행 데이터의 존재를 따로 확인해 이 구간을 막는다."}
  - {id: BLD-2-01, doc: build-gate-guideline.md, ch: 2, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "SonarQube Quality Gate가 커버리지를 판정하지 않는가", criteria: "판정 주체가 둘이면 기본 게이트값(신규 코드 80% 등)이 Gradle 기준과 충돌한다. 무료 플랜은 커스텀 게이트를 만들 수 없어 조건을 뺄 수 없으므로, `sonar.qualitygate.wait` 을 켜지 않는 것으로 대신한다."}
  - {id: BLD-2-02, doc: build-gate-guideline.md, ch: 2, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "정적 분석 차단 조건이 신규 `Blocker` 이슈 0건인가", criteria: "`Blocker`는 프로덕션에서 애플리케이션을 망가뜨릴 높은 확률의 버그를 뜻한다. 병합을 막을 근거가 되는 것은 이 등급뿐이다. 그 아래 등급은 차단하지 않고 경고로만 표시한다. 차단은 워크플로가 이슈 검색 API 로 신규 `Blocker` 수를 직접 세어 수행한다."}
  - {id: BLD-2-03, doc: build-gate-guideline.md, ch: 2, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "브랜치 보호의 필수 상태 검사에 `G-BUILD`가 등록되어 있는가", criteria: "커버리지와 정적 분석은 한 잡(`G-BUILD`) 안에서 함께 돌므로 등록되는 검사 이름은 하나다. 이것이 두 기준을 강제하는 유일한 수단이다. `G-PR`(LLM 판정)은 일부러 등록하지 않는다. 재현율이 측정되지 않은 판정으로 병합을 막으면 오탐이 쌓여 우회 문화가 생긴다."}
  - {id: DPB-1-01, doc: domain-package-boundary-guideline.md, ch: 1, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "도메인 루트에 API 인터페이스, record DTO, 공개 예외 외의 것이 없는가", criteria: "`@Entity`, Repository, Controller, 구현 클래스가 루트에 올라오면 다른 도메인이 영속 모델에 직접 의존하게 된다."}
  - {id: DPB-1-02, doc: domain-package-boundary-guideline.md, ch: 1, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "다른 도메인의 `internal` 패키지를 import하지 않는가"}
  - {id: DPB-1-03, doc: domain-package-boundary-guideline.md, ch: 1, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "API를 호출당하지 않는 도메인에도 의무적으로 만들지 않았는가", criteria: "쓰지 않는 API를 미리 만들면 유지할 계약만 늘고 아무도 소비하지 않는다."}
  - {id: DPB-1-04, doc: domain-package-boundary-guideline.md, ch: 1, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "`~ApiImpl`이 계층 안이 아니라 `internal` 바로 아래에 있는가", criteria: "'이 도메인이 밖에 무엇을 제공하는지'를 한 곳에서 찾을 수 있어야 한다."}
  - {id: DPB-1-05, doc: domain-package-boundary-guideline.md, ch: 1, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "스케줄러를 `internal/batch` 아래에 두었는가", criteria: "스케줄러는 계층이 아니라 트리거다. 계층 밖이라는 사실이 자리로 드러나야 한다."}
  - {id: DPB-2-01, doc: domain-package-boundary-guideline.md, ch: 2, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "공개 DTO에 엔티티를 그대로 담지 않았는가", criteria: "`record ProductInfo(Product product)`는 감춘 것이 없다. 필드를 값으로 풀어 담는다."}
  - {id: DPB-2-02, doc: domain-package-boundary-guideline.md, ch: 2, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "공개 DTO가 내부 enum을 그대로 노출하지 않는가", criteria: "노출하면 그 enum이 계약의 일부가 되어 상수 추가 시 다른 도메인 영향을 검토해야 한다."}
  - {id: DPB-2-03, doc: domain-package-boundary-guideline.md, ch: 2, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "도메인 예외를 통합 예외 하나와 에러 코드 enum으로 두었는가", criteria: "실패 종류마다 예외 클래스를 만들면 클래스 수가 계속 늘어난다."}
  - {id: DPB-2-04, doc: domain-package-boundary-guideline.md, ch: 2, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "다른 도메인이 구분해 처리해야 하는 실패만 별도 예외로 루트에 공개했는가"}
  - {id: DPB-2-05, doc: domain-package-boundary-guideline.md, ch: 2, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "에러 코드를 `common`의 enum 하나에 모으지 않았는가", criteria: "그 파일이 전 도메인 지식을 갖게 되어 경계가 무너진다. 도메인마다 접두사로 구분한다."}
  - {id: DPB-3-01, doc: domain-package-boundary-guideline.md, ch: 3, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "인터페이스를 도메인이 소유하고 구현체가 외부 스펙에 맞추는가", criteria: "`PaymentService`는 `PgClient`만 알고 어느 PG사인지 모른다."}
  - {id: DPB-3-02, doc: domain-package-boundary-guideline.md, ch: 3, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "외부 스펙 DTO를 도메인 밖으로 내보내지 않는가", criteria: "`client.dto`에 가두고 도메인이 쓰는 형태로 변환해 넘긴다."}
  - {id: DPB-3-03, doc: domain-package-boundary-guideline.md, ch: 3, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "최상위에 `client` 패키지를 두지 않았는가", criteria: "모든 도메인이 접근 가능해져 경계가 무너진다."}
  - {id: DPB-3-04, doc: domain-package-boundary-guideline.md, ch: 3, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "`client` 클래스에 `@Transactional`이 없는가", criteria: "네트워크 대기 중 DB 락이 유지된다."}
  - {id: DPB-3-05, doc: domain-package-boundary-guideline.md, ch: 3, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "웹훅 수신 시 본문을 검증하는가"}
  - {id: DPB-3-06, doc: domain-package-boundary-guideline.md, ch: 3, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "웹훅 처리가 멱등한가", criteria: "전송 실패 시 재시도가 오고, 구독 이벤트가 여럿이면 같은 상태 변경에 여러 번 도착할 수 있다."}
  - {id: DPB-4-01, doc: domain-package-boundary-guideline.md, ch: 4, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "공개 창구 이름이 도메인명 + `Api` 형태인가"}
  - {id: DPB-4-02, doc: domain-package-boundary-guideline.md, ch: 4, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "구현체 이름에 패턴명(`Facade` 등)을 넣지 않았는가"}
  - {id: DPB-4-03, doc: domain-package-boundary-guideline.md, ch: 4, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "자기 도메인 컨트롤러가 API를 경유하지 않는가", criteria: "같은 `domain` 안이므로 내부 서비스를 직접 쓴다. API는 도메인 간 협력 전용이다."}
  - {id: DPB-4-04, doc: domain-package-boundary-guideline.md, ch: 4, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "통과 위임만 하는 API 구현체가 아닌가", criteria: "변환이나 노출 범위 축소가 없으면 노이즈다."}
  - {id: DPB-4-05, doc: domain-package-boundary-guideline.md, ch: 4, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "API 구현체에 비즈니스 로직이 없는가", criteria: "조합과 변환만 하고 규칙 판단은 내부 서비스에 남긴다."}
  - {id: DPB-4-10, doc: domain-package-boundary-guideline.md, ch: 4, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "계층 패키지의 클래스가 그 계층 이름을 접미사로 갖는가", criteria: "`service` 패키지는 전체가 커버리지 100% 대상이므로, 서비스가 아닌 클래스를 두면 그것까지 100%를 요구받는다."}
  - {id: DPB-4-06, doc: domain-package-boundary-guideline.md, ch: 4, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "관리자 전용 컨트롤러, 서비스, DTO의 이름이 `Admin`으로 시작하는가", criteria: "중간이나 끝에 넣으면 정렬로 구분하려던 목적이 사라진다."}
  - {id: DPB-4-07, doc: domain-package-boundary-guideline.md, ch: 4, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "회원용 클래스에 `Member`, `User`, `Client` 같은 접두사를 붙이지 않았는가", criteria: "양쪽에 다 붙이면 접두사가 아무것도 구분해 주지 못한다. 회원용이 기본값이다."}
  - {id: DPB-4-08, doc: domain-package-boundary-guideline.md, ch: 4, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "클래스 이름의 `Admin` 유무가 URI의 `/admin` 유무와 일치하는가", criteria: "한쪽만 바꾸면 경로에서 클래스를 찾는 경로가 끊긴다."}
  - {id: DPB-4-09, doc: domain-package-boundary-guideline.md, ch: 4, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "엔티티와 레포지토리에 `Admin`을 붙이지 않았는가", criteria: "저장 모델이 소비자별로 갈라지면 같은 테이블에 두 개의 매핑이 생긴다."}
  - {id: DPB-5-01, doc: domain-package-boundary-guideline.md, ch: 5, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "같은 층끼리 직접 호출하지 않는가", criteria: "필요하면 상위 조합 도메인이 조립한다."}
  - {id: DPB-5-02, doc: domain-package-boundary-guideline.md, ch: 5, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "순환 의존이 없는가"}
  - {id: DPB-5-03, doc: domain-package-boundary-guideline.md, ch: 5, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "`common`이 특정 도메인을 참조하지 않는가", criteria: "`@ExceptionHandler(OutOfStockException.class)`처럼 개별 도메인 예외를 직접 잡으면 경계가 무너진다."}
  - {id: DPB-6-01, doc: domain-package-boundary-guideline.md, ch: 6, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "`~ApiImpl`과 `Controller`가 package-private인가", criteria: "Spring은 package-private 빈도 정상적으로 등록하고 주입한다."}
  - {id: DPB-6-02, doc: domain-package-boundary-guideline.md, ch: 6, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "계층 간 참조가 없는데 public으로 선언하지 않았는가"}
  - {id: DPB-6-03, doc: domain-package-boundary-guideline.md, ch: 6, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "ArchUnit 테스트가 빌드 파이프라인에 묶여 있는가", criteria: "계층 구조에서는 테스트가 유일한 자동 검증 수단이다."}
  - {id: DPB-6-04, doc: domain-package-boundary-guideline.md, ch: 6, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "`consideringOnlyDependenciesInLayers()`가 적용되어 있는가", criteria: "없으면 계층으로 선언하지 않은 패키지와의 의존까지 검사되어 오탐이 발생한다."}
  - {id: DPB-6-05, doc: domain-package-boundary-guideline.md, ch: 6, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "`entity`, `dto`, `exception`을 계층으로 선언하지 않았는가", criteria: "여러 계층이 자유롭게 참조하는 타입이라 방향 제약 대상이 아니다."}
  - {id: DPB-7-01, doc: domain-package-boundary-guideline.md, ch: 7, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "API 구현체와 `client` 클래스에 `@Transactional`이 없는가", criteria: "경계 선언을 내부 서비스 한 곳으로 모으기 위한 규칙이며, 6.2절 ArchUnit이 강제한다."}
  - {id: EJ-1-01, doc: effective-java-guideline.md, ch: 1, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "생성자 대신 정적 팩터리 메서드라는 선택지를 검토했는가 (아이템 1)", criteria: "이름으로 의도를 드러낼 수 있고, 호출마다 새 인스턴스를 만들지 않아도 된다."}
  - {id: EJ-1-02, doc: effective-java-guideline.md, ch: 1, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "생성자 인자가 많으면 빌더를 고려했는가 (아이템 2)", criteria: "인자 순서 혼동을 줄이고 어떤 값을 넣는지 이름으로 드러낸다."}
  - {id: EJ-1-03, doc: effective-java-guideline.md, ch: 1, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "자원을 직접 명시하지 않고 의존성 주입으로 받는가 (아이템 5)", criteria: "Spring에서는 생성자 주입으로 협력 객체를 받아 결합을 낮추고 테스트를 쉽게 한다."}
  - {id: EJ-1-04, doc: effective-java-guideline.md, ch: 1, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "불필요한 객체 생성을 피했는가 (아이템 6)", criteria: "반복마다 같은 불변 객체를 새로 만들지 않고 재사용한다."}
  - {id: EJ-1-05, doc: effective-java-guideline.md, ch: 1, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "다 쓴 참조를 정리해 메모리 누수를 막는가 (아이템 7)", criteria: "컬렉션이나 캐시가 참조를 계속 들고 있으면 GC 대상이 되지 못한다."}
  - {id: EJ-1-06, doc: effective-java-guideline.md, ch: 1, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "try-finally 대신 try-with-resources로 자원을 닫는가 (아이템 9)", criteria: "예외가 나도 자원을 확실히 해제하고 코드도 간결해진다."}
  - {id: EJ-2-01, doc: effective-java-guideline.md, ch: 2, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "equals를 재정의할 때 규약(반사성, 대칭성, 추이성, 일관성)을 지켰는가 (아이템 10)"}
  - {id: EJ-2-02, doc: effective-java-guideline.md, ch: 2, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "equals를 재정의하면 hashCode도 함께 재정의했는가 (아이템 11)", criteria: "둘이 어긋나면 HashMap이나 HashSet에서 객체를 못 찾는 문제가 생긴다."}
  - {id: EJ-2-03, doc: effective-java-guideline.md, ch: 2, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "디버깅에 도움이 되도록 toString을 의미 있게 재정의했는가 (아이템 12)"}
  - {id: EJ-3-01, doc: effective-java-guideline.md, ch: 3, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "접근 제어자를 최소한으로 두어 캡슐화했는가 (아이템 15)"}
  - {id: EJ-3-02, doc: effective-java-guideline.md, ch: 3, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "public 클래스에서 필드를 직접 노출하지 않고 접근자를 쓰는가 (아이템 16)"}
  - {id: EJ-3-03, doc: effective-java-guideline.md, ch: 3, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "가변성을 최소화했는가, 가능하면 불변 객체로 두었는가 (아이템 17)", criteria: "불변 객체는 공유해도 안전하고 상태가 예측 가능하다."}
  - {id: EJ-3-04, doc: effective-java-guideline.md, ch: 3, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "상속보다 조합을 우선했는가 (아이템 18)", criteria: "상속은 상위 클래스 구현에 강하게 묶여 변경에 취약하다."}
  - {id: EJ-3-05, doc: effective-java-guideline.md, ch: 3, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "상속을 의도하지 않은 클래스는 확장을 금지했는가 (아이템 19)", criteria: "확장을 고려해 설계하고 문서화하거나, 아니면 final로 닫는다."}
  - {id: EJ-3-06, doc: effective-java-guideline.md, ch: 3, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "추상 클래스보다 인터페이스를 우선 고려했는가 (아이템 20)"}
  - {id: EJ-4-01, doc: effective-java-guideline.md, ch: 4, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "로 타입을 쓰지 않고 타입 파라미터를 명시했는가 (아이템 26)", criteria: "로 타입은 컴파일 시점 타입 검사를 잃는다."}
  - {id: EJ-4-02, doc: effective-java-guideline.md, ch: 4, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "비검사 경고를 제거했는가, 억제한다면 근거를 남겼는가 (아이템 27)"}
  - {id: EJ-4-03, doc: effective-java-guideline.md, ch: 4, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "배열보다 리스트를 우선 고려했는가 (아이템 28)"}
  - {id: EJ-4-04, doc: effective-java-guideline.md, ch: 4, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "API 유연성을 위해 한정적 와일드카드를 적절히 썼는가 (아이템 31)", criteria: "생산자에는 extends, 소비자에는 super를 적용한다."}
  - {id: EJ-5-01, doc: effective-java-guideline.md, ch: 5, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "상수 집합을 int 상수 대신 enum으로 표현했는가 (아이템 34)", criteria: "타입 안전하고 이름으로 의도를 드러낸다."}
  - {id: EJ-5-02, doc: effective-java-guideline.md, ch: 5, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "enum 키에는 EnumMap을 쓰는가 (아이템 37)"}
  - {id: EJ-5-03, doc: effective-java-guideline.md, ch: 5, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "재정의 메서드에 @Override를 일관되게 붙였는가 (아이템 40)", criteria: "시그니처 불일치를 컴파일 단계에서 잡는다."}
  - {id: EJ-6-01, doc: effective-java-guideline.md, ch: 6, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "익명 클래스 대신 람다로 간결하게 표현했는가 (아이템 42)"}
  - {id: EJ-6-02, doc: effective-java-guideline.md, ch: 6, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "더 명확할 때 메서드 참조를 활용했는가 (아이템 43)"}
  - {id: EJ-6-03, doc: effective-java-guideline.md, ch: 6, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "스트림을 적절한 곳에만 썼는가, 남용하지 않았는가 (아이템 45)", criteria: "모든 반복을 스트림으로 바꾸면 오히려 읽기 어렵다."}
  - {id: EJ-6-04, doc: effective-java-guideline.md, ch: 6, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "스트림 연산을 부수 효과 없이 작성했는가 (아이템 46)", criteria: "forEach로 외부 상태를 바꾸기보다 collect로 결과를 모은다."}
  - {id: EJ-7-01, doc: effective-java-guideline.md, ch: 7, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "파라미터 유효성을 메서드 시작 부분에서 검사하는가 (아이템 49)", criteria: "잘못된 값은 들어오자마자 막아 원인에서 먼 곳에서 터지는 것을 방지한다."}
