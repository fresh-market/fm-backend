  - {id: IDS-2-05, doc: identifier-strategy-guideline.md, ch: 2, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database, security], level_verified: false, title: "API 가 정해지지 않았는데 확정으로 적지 않았는가", criteria: "2.2절의 두 조건에 걸리지 않으면 잠정이다."}
  - {id: IDS-3-01, doc: identifier-strategy-guideline.md, ch: 3, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database, security], level_verified: false, title: "v4를 선택한 테이블에 사유가 기록되어 있는가", criteria: "사유가 없으면 v7이다. 기록이 없으면 다음 사람이 판단을 재현할 수 없다."}
  - {id: IDS-3-02, doc: identifier-strategy-guideline.md, ch: 3, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database, security], level_verified: false, title: "v1, v3, v5, v6, v8을 쓰지 않았는가", criteria: "v1과 v6은 MAC 주소가 박히고, v3과 v5는 난수가 0비트다. MySQL 내장 `UUID()`가 v1이다."}
  - {id: IDS-3-03, doc: identifier-strategy-guideline.md, ch: 3, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database, security], level_verified: false, title: "외부 식별자로 조회할 때 소유권 또는 권한 검증을 함께 수행하는가", criteria: "추측 불가능성은 인가를 대체하지 않는다. 일반적인 인가 판정은 common 저장소 `qa-security-guideline.md` 1장(`SEC-1-*`)이 소유한다. 이 항목은 그중 외부 식별자 경로에 한정한 재확인이다."}
  - {id: IDS-4-01, doc: identifier-strategy-guideline.md, ch: 4, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database, security], level_verified: false, title: "난수원이 `SecureRandom`인가", criteria: "`java.util.Random`은 시드가 48비트뿐이라 몇 개의 출력만 관측해도 내부 상태가 복원된다. `ThreadLocalRandom`도 금지한다."}
  - {id: IDS-4-02, doc: identifier-strategy-guideline.md, ch: 4, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database, security], level_verified: false, title: "`SecureRandom.getInstanceStrong()`을 쓰지 않았는가", criteria: "리눅스에서 블로킹 엔트로피 소스에 연결될 수 있어 컨테이너 기동 직후 애플리케이션이 통째로 정지한다."}
  - {id: IDS-4-03, doc: identifier-strategy-guideline.md, ch: 4, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database, security], level_verified: false, title: "외부 UUID 라이브러리를 도입했다면 난수원을 확인했는가", criteria: "일부 v7 구현체가 속도를 위해 rand_b를 비암호학적 PRNG로 채운다."}
  - {id: IDS-4-04, doc: identifier-strategy-guideline.md, ch: 4, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database, security], level_verified: false, title: "단조 옵션을 쓴다면 증가값이 CSPRNG에서 나오는가", criteria: "RFC 9562가 경고하는 것은 증가값이 고정된 카운터(Method 1)다. 앞의 값을 보면 다음 값이 그대로 나온다. 증가값을 난수로 뽑는 Method 2는 인접한 두 값 사이에 32비트 이상을 남기므로 허용한다."}
  - {id: IDS-4-05, doc: identifier-strategy-guideline.md, ch: 4, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database, security], level_verified: false, title: "밀리초가 바뀔 때 난수 부분을 다시 뽑는가", criteria: "같은 시각 구간 안에서만 값이 이어져야 한다. 구간을 넘어서까지 이어지면 상관관계가 누적된다."}
  - {id: IDS-5-01, doc: identifier-strategy-guideline.md, ch: 5, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database, security], level_verified: false, title: "`public_id`가 `@UuidGenerator`로 채워지는가", criteria: "엔티티나 서비스가 직접 대입하면 3절의 버전 규칙을 우회하는 경로가 생긴다."}
  - {id: IDS-5-02, doc: identifier-strategy-guideline.md, ch: 5, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database, security], level_verified: false, title: "`style`을 명시했는가", criteria: "기본값 `AUTO`는 `RANDOM`으로 풀려 v4가 된다. 생략하면 사유 없이 v4를 쓰게 된다."}
  - {id: IDS-5-03, doc: identifier-strategy-guideline.md, ch: 5, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database, security], level_verified: false, title: "`GenerationType.UUID`를 쓰지 않았는가", criteria: "JPA 표준은 버전을 규정하지 않고 Hibernate는 v4로 구현한다. 버전을 고를 수 없다."}
  - {id: IDS-5-04, doc: identifier-strategy-guideline.md, ch: 5, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database, security], level_verified: false, title: "`public_id` 컬럼에 `updatable = false`가 지정되어 있는가", criteria: "생성이 INSERT로 한정되는 것은 `@UuidGenerator`가 `EventTypeSets.INSERT_ONLY`를 반환해 보장한다. 이 항목은 우리 쪽 잠금이다. 필드에 대입하는 코드가 생겨도 UPDATE 문에 실리지 않는다."}
  - {id: IDS-6-01, doc: identifier-strategy-guideline.md, ch: 6, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database, security], level_verified: false, title: "`public_id`가 `BINARY(16)`이고 `NOT NULL`인가"}
  - {id: IDS-6-02, doc: identifier-strategy-guideline.md, ch: 6, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database, security], level_verified: false, title: "`DEFAULT (UUID())`를 걸지 않았는가"}
  - {id: IDS-6-03, doc: identifier-strategy-guideline.md, ch: 6, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database, security], level_verified: false, title: "FK와 조인 조건이 내부 식별자를 쓰는가"}
  - {id: IDS-7-01, doc: identifier-strategy-guideline.md, ch: 7, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database, security], level_verified: false, title: "응답 DTO나 API 경로에 내부 `Long id`가 없는가", criteria: "한 번 노출되면 클라이언트가 의존하기 시작해 되돌릴 수 없다."}
  - {id: IDS-7-02, doc: identifier-strategy-guideline.md, ch: 7, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database, security], level_verified: false, title: "대량 조회 경로가 외부 식별자 목록으로 돌지 않는가"}
  - {id: IDS-7-03, doc: identifier-strategy-guideline.md, ch: 7, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database, security], level_verified: false, title: "응답 DTO의 필드명이 `publicId`가 아니라 `id`인가", criteria: "클라이언트에게는 그것이 유일한 식별자다. 다른 ID의 존재를 알릴 이유가 없다."}
  - {id: IDS-7-04, doc: identifier-strategy-guideline.md, ch: 7, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database, security], level_verified: false, title: "서비스 진입 메서드가 외부 식별자를 둘 이상 나열해서 받지 않는가", criteria: "`UUID`가 나란히 있으면 순서를 바꿔 넣어도 컴파일이 통과하고, 조회가 비거나 조용히 틀린 값이 저장된다. 커맨드 객체로 묶으면 순서를 틀릴 자리가 사라진다. 타입 래퍼를 두지 않는 대신 이 규칙이 그 자리를 맡는다."}
  - {id: IDS-8-01, doc: identifier-strategy-guideline.md, ch: 8, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database, security], level_verified: false, title: "외부 입력 UUID 파싱 실패가 400으로 매핑되는가", criteria: "`UUID.fromString`의 `IllegalArgumentException`을 그대로 두면 500이 나간다."}
  - {id: IDS-9-01, doc: identifier-strategy-guideline.md, ch: 9, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database, security], level_verified: false, title: "UUID를 정렬 키나 커서 페이지네이션 키로 쓰지 않는가", criteria: "v7도 같은 밀리초 내 순서는 보장되지 않아 행이 건너뛰어진다. 정렬은 시각 컬럼과 PK 조합으로 한다."}
  - {id: IDS-10-01, doc: identifier-strategy-guideline.md, ch: 10, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database, security], level_verified: false, title: "비즈니스 식별자를 API 식별자로 쓰지 않는가", criteria: "규칙이 있어 추측 가능하다. 조회 파라미터로는 쓸 수 있으나 그때도 소유권 검증이 선행되어야 한다."}
  - {id: JPA-1-01, doc: jpa-rdb-guideline.md, ch: 1, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database], level_verified: false, title: "테이블 하나에 엔티티 하나가 대응하도록 최대한 단순하게 유지했는가", criteria: "테이블을 보면 엔티티가 보이고, 엔티티를 보면 테이블이 보여야 한다."}
  - {id: JPA-1-02, doc: jpa-rdb-guideline.md, ch: 1, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database], level_verified: false, title: "외래 키를 연관 객체 매핑 대신 식별자 컬럼으로 그대로 반영하는 선택을 검토했는가"}
  - {id: JPA-1-03, doc: jpa-rdb-guideline.md, ch: 1, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database], level_verified: false, title: "비즈니스 로직이나 화면에 필요한 복합 객체를 엔티티에 넣지 않고 서비스 레이어나 DTO에서 조합했는가"}
  - {id: JPA-2-01, doc: jpa-rdb-guideline.md, ch: 2, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database], level_verified: false, title: "`@ManyToMany`로 조인 테이블을 자동 생성하지 않는가", criteria: "자동 생성된 조인 테이블의 컬럼명, 인덱스, 제약 조건이 코드에 드러나지 않으면 DB를 직접 확인하기 전까지 구조를 알 수 없다."}
  - {id: JPA-2-02, doc: jpa-rdb-guideline.md, ch: 2, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database], level_verified: false, title: "객체를 JSON 컬럼에 자동 매핑(`@JdbcTypeCode(SqlTypes.JSON)` 등)할 때, 그 컬럼 구조와 조회 방식을 이해하고 책임질 수 있는가"}
  - {id: JPA-2-03, doc: jpa-rdb-guideline.md, ch: 2, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database], level_verified: false, title: "'편해서 쓰는 것'과 '이해하고 쓰는 것'을 구분했는가", criteria: "기능 자체가 금지는 아니다. 만들어지는 DB 구조와 실행 쿼리를 정확히 이해하고 책임질 수 있을 때만 쓴다."}
  - {id: JPA-3-01, doc: jpa-rdb-guideline.md, ch: 3, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database], level_verified: false, title: "`cascade = CascadeType.ALL`과 깊은 연관관계로 save 한 번에 여러 테이블이 묶여 쓰이지 않는가", criteria: "무엇이 몇 건 INSERT되는지 호출부에서 드러나야 한다."}
  - {id: JPA-3-02, doc: jpa-rdb-guideline.md, ch: 3, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database], level_verified: false, title: "연관 객체의 저장을 의도적으로 분리해, 각 쓰기가 어떤 테이블에 일어나는지 추적 가능한가"}
  - {id: JPA-4-01, doc: jpa-rdb-guideline.md, ch: 4, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database], level_verified: false, title: "복합 객체를 엔티티에 넣지 않고 별도 DTO로 정의했는가"}
  - {id: JPA-4-02, doc: jpa-rdb-guideline.md, ch: 4, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database], level_verified: false, title: "화면용 복합 객체를 서비스 레이어에서 조합하고, 엔티티는 데이터만 읽어 오는 역할에 두는가"}
  - {id: JPA-4-03, doc: jpa-rdb-guideline.md, ch: 4, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database], level_verified: false, title: "복잡한 조회를 엔티티 전체 로딩과 객체 그래프 탐색으로 풀지 않고, 필요한 컬럼만 DTO로 프로젝션하는가"}
  - {id: JPA-4-04, doc: jpa-rdb-guideline.md, ch: 4, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database], level_verified: false, title: "성능 문제를 사후에 실행 계획으로 수습하기 전에, 설계 시점에 쿼리 형태를 고려했는가", criteria: "(N+1, 인덱스 활용 등 쿼리 차원의 점검은 database.md를 함께 본다.)"}
  - {id: JPA-4-05, doc: jpa-rdb-guideline.md, ch: 4, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database], level_verified: false, title: "DTO가 늘고 코드가 길어지는 것을 감수하더라도, 자동 매핑에 맡겨 성능과 DB 구조의 명확성을 잃는 쪽을 택하지 않았는가", criteria: "편리함의 대가는 성능 문제와 유지보수 비용으로 돌아온다."}
  - {id: JPA-5-01, doc: jpa-rdb-guideline.md, ch: 5, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database], level_verified: false, title: "JPA를 다음 목적 안에서 쓰는가", criteria: "반복적인 SQL 작성을 줄이기 위해, 파라미터 바인딩을 안전하게 처리하기 위해, 타입 안정성을 가지고 데이터를 읽고 쓰기 위해, DB 테이블과 엔티티의 기본 매핑을 편하게 관리하기 위해."}
  - {id: JPA-5-02, doc: jpa-rdb-guideline.md, ch: 5, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [database], level_verified: false, title: "메모리 객체 자동 분해, 깊은 `cascade` 저장, 조인 테이블 자동 생성, JSON 자동 매핑 같은 기능은, 그것이 만들어 내는 DB 구조와 실행 쿼리를 정확히 이해하고 책임질 수 있을 때만 쓰는가"}
  - {id: UT-1-01, doc: unit-testing-guideline.md, ch: 1, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "회귀 방어: 테스트가 실제 버그를 잡아내는가", criteria: "의미 있는 로직을 실행하고 결과를 검증해야 회귀를 잡는다. 단순 getter만 호출하는 테스트는 방어력이 약하다."}
  - {id: UT-1-02, doc: unit-testing-guideline.md, ch: 1, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "리팩터링 내성: 동작이 그대로인데 내부 구현만 바꿔도 테스트가 깨지지 않는가", criteria: "구현 세부에 묶인 테스트는 리팩터링마다 깨져 거짓 경보를 낸다."}
  - {id: UT-1-03, doc: unit-testing-guideline.md, ch: 1, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "빠른 피드백: 테스트가 빠르게 실행되는가", criteria: "느린 테스트는 자주 돌리지 않게 되어 가치가 떨어진다."}
  - {id: UT-1-04, doc: unit-testing-guideline.md, ch: 1, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "유지보수성: 테스트가 읽기 쉽고 고치기 쉬운가", criteria: "테스트가 복잡하면 코드보다 테스트를 이해하는 데 시간이 더 든다."}
  - {id: UT-2-01, doc: unit-testing-guideline.md, ch: 2, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "결과나 상태 변화 등 외부에서 관찰 가능한 동작을 검증하는가"}
  - {id: UT-2-02, doc: unit-testing-guideline.md, ch: 2, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "내부 메서드 호출 순서나 횟수 같은 구현 세부를 검증하지 않는가"}
  - {id: UT-2-03, doc: unit-testing-guideline.md, ch: 2, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "private 메서드를 직접 테스트하지 않고 공개 API를 통해 검증하는가", criteria: "private 메서드를 따로 테스트하고 싶어진다면, 그것이 별도 책임이라는 신호일 수 있다."}
  - {id: UT-3-01, doc: unit-testing-guideline.md, ch: 3, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "준비(given), 실행(when), 검증(then) 단계가 구분되는가"}
