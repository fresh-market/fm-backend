  - {id: UT-4-03, doc: unit-testing-guideline.md, ch: 4, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 1, domains: [application], level_verified: false, title: "모든 의존성을 무분별하게 모킹하지 않는가", criteria: "과도한 모킹은 테스트를 구현 세부에 묶고 리팩터링 내성을 떨어뜨린다."}
