# PR 게이트. G-BUILD 와 G-PR 을 한 워크플로에 둔다.
#
# 두 게이트를 한 파일에 둔 이유는 needs 로 순서를 매기기 위해서다.
# 워크플로가 갈라져 있으면 needs 를 쓸 수 없어 빌드가 깨진 PR 에도 판정이 돈다.
# Gemini 무료 티어는 분당 요청 수가 10 이라 그 낭비가 그대로 뒤 PR 을 밀리게 한다.
#
# 차단하는 것은 build 뿐이다. verify 는 지적만 남긴다.
# 근거는 fresh-market/.github 의 docs/software-quality/qa-llm-verification.md 에 있다.
# 재현율이 측정되지 않은 판정으로 병합을 막으면 오탐이 쌓여 우회 문화가 생긴다.

name: PR 게이트

on:
  pull_request:
    # develop 은 팀원의 작업 대상이고 main 은 릴리스 대상이다.
    branches: [develop, main]
    # synchronize 는 PR 이 열린 뒤의 push, reopened 는 닫힌 동안 움직인 base 를 위한 것이다.
    types: [opened, synchronize, reopened]

# 같은 PR 에 push 가 이어지면 앞선 실행을 취소한다.
concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # --- G-BUILD. 차단한다 ---------------------------------------------------
  build:
    name: G-BUILD
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          # SonarQube 가 신규 코드를 가리려고 blame 을 읽으므로 전체 이력이 필요하다.
          fetch-depth: 0

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      # check 는 test, integrationTest, jacocoTestCoverageVerification 을 모두 부른다.
      # 커버리지 기준은 *.domain.service.* 의 메서드 100% 다.
      - name: 테스트와 커버리지
        run: ./gradlew check --no-daemon

      # SONAR_TOKEN 이 없으면 건너뛴다. 토큰을 넣기 전에도 커버리지 게이트는 돌아야 한다.
      - name: 정적 분석
        if: env.SONAR_TOKEN != ''
        run: ./gradlew sonar --no-daemon

      # sonar 태스크는 분석 결과를 올리기만 하고 성공으로 끝난다. 차단은 여기서 한다.
      #
      # sonar.qualitygate.wait 을 쓰지 않는 이유는 무료 플랜이 내장 게이트 Sonar way 만
      # 쓸 수 있어서다. 거기에는 "신규 코드 커버리지 80% 이상" 이 들어 있어, Gradle 의
      # 서비스 레이어 100% 기준과 커버리지 판정 주체가 둘이 된다 (BLD-2-01).
      # 커스텀 게이트로 그 조건을 빼려면 Team 플랜이 필요하다.
      # 이슈 검색 API 는 무료 플랜에서도 되므로 신규 Blocker 만 직접 센다 (BLD-2-02).
      - name: 신규 Blocker 0건 확인
        if: env.SONAR_TOKEN != ''
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          KEY=fresh-market_fm-backend
          Q="componentKeys=$KEY&severities=BLOCKER&resolved=false&ps=100&pullRequest=$PR"
          RES=$(curl -sS -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/issues/search?$Q")
          N=$(printf '%s' "$RES" | jq -r '.total // "err"')
          echo "신규 Blocker ${N}건"
          if [ "$N" = "err" ]; then
            echo "::error::이슈 조회에 실패했다. 응답: $(printf '%s' "$RES" | head -c 300)"
            exit 1
          fi
          if [ "$N" != "0" ]; then
            printf '%s' "$RES" | jq -r '.issues[] | "::error file=\(.component | sub("^[^:]*:"; "")),line=\(.line // 1)::\(.message)"'
            echo "신규 Blocker 가 남아 있어 병합을 막는다."
            exit 1
          fi

      - name: 정적 분석을 건너뛴 이유
        if: env.SONAR_TOKEN == ''
        run: |
          echo "::warning::SONAR_TOKEN 이 없어 정적 분석을 건너뛰었다. 저장소 Secrets 에 등록해야 한다."

      - name: 테스트 리포트
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/reports/jacoco/
          retention-days: 7
          if-no-files-found: ignore

  # --- G-PR. 차단하지 않는다 -----------------------------------------------
  #
  # develop 을 향한 PR 에서만 돈다. main 은 develop 이 이미 판정한 것을 받으므로
  # 같은 변경을 두 번 판정하면 무료 티어 한도만 쓴다.
  verify:
    name: G-PR
    needs: build
    if: github.base_ref == 'develop'
    uses: fresh-market/.github/.github/workflows/llm-verify.yml@main
    with:
      # 다른 저장소 항목까지 판정한다.
      # 끄면 backend 275건만 보고 common 의 품질 속성과 infra 의 인프라 제약은
      # 아무도 강제로 보지 않는다. 켜면 484건이고 호출이 1회에서 2회로 는다.
      full: true
    secrets:
      # 갱신 잡이 조립해 둔 CLI 인증 파일이다. 없으면 API 키로 떨어진다.
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
