# 원본은 fm-infra 의 docs/deploy/backend-deploy-workflow.yml 이다.
# 배포 절차가 인프라 결정에서 나오므로 그쪽이 소유한다.
# ASG 이름, 대상 그룹 이름, SSM 경로가 전부 Terraform 이 정한 값이다.
#
# 이 워크플로가 쓰는 설정
#   변수   AWS_DEPLOY_ROLE_ARN   terraform output github_role_arns 의 deploy 값
#   변수   SMOKE_PATH            ALB 경유 스모크 경로. 비우면 /v1/products
#   시크릿 SLACK_WEBHOOK_DEPLOY  #alerts-deploy 채널 웹훅

name: 배포

# main 병합 시에만 배포한다.
#
# 팀원은 develop 으로만 PR 을 열고 main 으로 가는 경로는 관리자의 릴리스 PR 뿐이다.
# main 은 보호 브랜치라 PR 병합 외에 push 경로가 없으므로 이 트리거로 충분하다.
#
# AWS 쪽에서도 같은 조건이 강제된다.
# 배포 역할의 신뢰 정책이 repo:...:ref:refs/heads/main 으로 못 박혀 있어
# 다른 브랜치에서 이 워크플로를 돌려도 STS 가 자격증명을 주지 않는다.
on:
  push:
    branches: [main]

  # 브랜치를 골라 배포한다. 부하 시험으로 버전을 비교하려면 이 길이 필요하다.
  #
  # v1 에서 v3 까지는 v4 보다 나쁜 구현이다. 비교 데이터를 만들려고 그것을 main 에 병합하면
  # 운영이 잠시 그 버전으로 돈다. 그래서 main 을 거치지 않고 브랜치에서 바로 이미지를 만든다.
  #
  # 위험은 하나다. 이 길로 올린 브랜치 이미지가 운영에 남는다. 그래서 시험이 끝나면 main 을
  # 다시 배포해 되돌린다. 아래 skip_rolling 을 쓰면 이미지만 만들고 굴리지 않는다.
  #
  # 태그가 커밋 SHA 이고 ECR 이 IMMUTABLE 이라 버전마다 태그가 달라 서로 덮지 않는다.
  workflow_dispatch:
    inputs:
      skip_rolling:
        description: 이미지만 만들고 롤링 배포는 건너뛴다
        type: boolean
        default: false

# 배포는 중간에 끊으면 안 된다. 구 인스턴스를 지우는 도중에 취소되면 용량이 반이 된다.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

# packages 는 GHCR 시절의 것이다. ECR 로 옮기면서 뺐다.
permissions:
  contents: read
  id-token: write

jobs:
  # 인프라가 서 있는지만 본다. 없으면 배포를 건너뛴다.
  #
  # 이 저장소는 destroy 를 반복한다. 인프라가 내려가 있는 동안 main 에 병합하면 배포가
  # 반드시 실패했고, 2026-09-24 와 09-26 에 5회가 그렇게 쌓였다. 앱과 무관한 빨간 X 다.
  #
  # 건너뛰기와 실패를 가르는 기준은 "자원이 아예 없는가" 하나다.
  # 있는데 상태가 나쁜 것은 그대로 실패시킨다. 그것까지 건너뛰면 고쳐야 할 배포가 조용히
  # 넘어가고, 그것은 판정 0건을 초록으로 넘기던 것과 같은 고장이다.
  #
  # 인프라가 돌아오면 apply.sh 7단계가 이 워크플로를 다시 건다. 건너뛴 배포가 유실되지 않는다.
  check:
    runs-on: ubuntu-latest
    outputs:
      up: ${{ steps.probe.outputs.up }}
    steps:
      # 자격은 인프라가 없어도 얻어진다. OIDC 공급자와 배포 역할이 bootstrap 에 있고
      # destroy 대상이 아니기 때문이다 (fm-infra 의 bootstrap/iam_github.tf).
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - id: probe
        run: |
          N=$(aws autoscaling describe-auto-scaling-groups \
                --auto-scaling-group-names freshmarket-app \
                --query 'length(AutoScalingGroups)' --output text 2>/dev/null || echo 0)
          if [ "$N" = "1" ]; then
            echo "up=true" >> "$GITHUB_OUTPUT"
            echo "인프라가 서 있다. 배포를 진행한다"
          else
            echo "up=false" >> "$GITHUB_OUTPUT"
            echo "::warning::앱 ASG 가 없다. 인프라가 내려가 있어 배포를 건너뛴다. apply.sh 를 돌리면 7단계가 이 배포를 다시 건다"
          fi

  deploy:
    needs: check
    # 인프라가 없으면 건너뛴다. 다만 이미지만 만드는 요청은 인프라와 무관하므로 통과시킨다.
    if: needs.check.outputs.up == 'true' || inputs.skip_rolling == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 배포 스크립트는 fm-infra 가 소유한다. llm-verify 가 형제 저장소를 받아 쓰는 것과 같은 방식이다.
      - name: 인프라 스크립트
        uses: actions/checkout@v4
        with:
          repository: fresh-market/fm-infra
          path: infra

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: 빌드
        run: ./gradlew bootJar --no-daemon

      # ECR 로그인에 필요해서 push 앞에 있다. GHCR 일 때는 배포 단계 앞에만 있으면 됐다.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 태그는 커밋 SHA 다. latest 를 쓰지 않는다.
      # 어느 인스턴스가 어느 버전인지 태그만 보고 알 수 있어야 롤백 판단이 선다.
      #
      # 저장소가 IMMUTABLE 이라 같은 SHA 로 다시 밀면 push 가 거부된다.
      # 재실행으로 이미지가 바뀌는 일이 없어야 태그가 버전의 근거가 된다.
      - name: 이미지 push
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/freshmarket:${{ github.sha }}
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      # 0번 사전 점검부터 10번 최종 확인까지 스크립트가 수행한다.
      - name: 롤링 배포
        if: ${{ inputs.skip_rolling != true }}
        env:
          PROJECT: freshmarket
          # 스모크 대상의 호스트는 deploy.sh 가 ALB 에서 직접 조회한다.
          # 여기서 정하는 것은 경로뿐이고, 비우면 /v1/products 를 쓴다.
          SMOKE_PATH: ${{ vars.SMOKE_PATH }}
        run: infra/scripts/deploy.sh ${{ github.sha }}

      # 배포 알림만 Alertmanager 를 거치지 않는다.
      # AWS 자격증명을 얻기 전에도 실패를 알려야 해서 웹훅을 저장소 시크릿에 둔다.
      - name: 결과 알림
        if: always()
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_DEPLOY }}
        run: |
          [ -z "$WEBHOOK" ] && exit 0
          STATUS="${{ job.status }}"
          curl -fsS -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\"[$STATUS] 배포 ${{ github.sha }} by ${{ github.actor }}\"}"
